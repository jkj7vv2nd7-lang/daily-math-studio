<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>日々の数学演習 Daily Math Studio</title>
<meta name="description" content="日付で進む記述演習。理系・文系・高校受験の3コース、1日1題を自己採点チェックリストで仕上げる数学演習アプリ。">
<meta property="og:title" content="日々の数学演習 Daily Math Studio">
<meta property="og:description" content="1日1題、記述の得点力を鍛える。3コース×日付で進む数学演習。">

<meta property="og:url" content="https://jkj7vv2nd7-lang.github.io/daily-math-studio/">

<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">

<style>
:root{
  --bg:#f4f1ea; --card:#fffdf8; --ink:#26303c; --sub:#68707c; --line:#ddd5c4;
  --brand:#274156; --brand2:#b57e2e; --accent:#2e6f4e; --chip:#efe9db;
  --ok:#2e7d4f; --warn:#b57e2e; --bad:#b0483e;
}
body.dark{
  --bg:#16211b; --card:#1e2f26; --ink:#eef3ec; --sub:#a9bcb0; --line:#38503f;
  --brand:#0f1a13; --brand2:#e0aa4e; --accent:#7fc79b; --chip:#2a4234;
  --ok:#7fc79b; --warn:#e0aa4e; --bad:#e88a7d;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;line-height:1.65}
header{background:var(--brand);color:#fff;padding:10px 14px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:20}
header h1{font-size:19px;margin:0;line-height:1.3}
header .sub{font-size:11.5px;opacity:.85}
header .sp{flex:1}
.hbtn{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:9px;padding:7px 10px;font-size:13px;font-weight:700}
#streak{font-weight:800;font-size:14px;background:rgba(255,255,255,.14);border-radius:9px;padding:7px 10px}
#courseBar{display:flex;gap:8px;padding:10px 12px 2px;max-width:860px;margin:0 auto}
#courseBar button{flex:1;padding:10px 4px;border-radius:11px;border:2px solid var(--line);background:var(--card);color:var(--ink);font-size:14.5px;font-weight:800}
#courseBar button.on{border-color:var(--brand2);color:var(--brand2)}
main{max-width:860px;margin:0 auto;padding:10px 12px 30px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0;box-shadow:0 1px 3px rgba(30,30,20,.06)}
.card h2{font-size:17px;margin:2px 0 8px}
.small{font-size:13px;color:var(--sub)}
.btn{display:inline-block;background:var(--brand);color:#fff;border:none;border-radius:10px;padding:11px 16px;font-size:15px;font-weight:800;margin:4px 4px 4px 0}
body.dark .btn{background:#33523f}
.btn.sub{background:var(--chip);color:var(--ink);border:1px solid var(--line)}
.btn.gold{background:var(--brand2);color:#fff}
.btn.sm{padding:7px 11px;font-size:13.5px}
.btn:disabled{opacity:.45}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.dateNav{display:flex;align-items:center;gap:8px}
.dateNav .dt{flex:1;text-align:center;font-weight:800;font-size:17px}
.chip{display:inline-block;background:var(--chip);border-radius:999px;padding:3px 11px;font-size:12.5px;font-weight:700;margin-right:6px}
.stmt{font-size:16.5px;line-height:1.9;white-space:pre-wrap}
.figwrap{text-align:center;margin:10px 0}
.figwrap svg{max-width:100%;height:auto;background:#fff;border:1px solid var(--line);border-radius:10px}
body.dark .figwrap svg{background:#f4f6f2}
.math{font-family:"Times New Roman","Hiragino Mincho ProN","Yu Mincho",serif;font-size:1.07em;white-space:nowrap}
.math i{font-style:italic}
.frac{display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;margin:0 .08em;font-size:.86em;line-height:1.25}
.frac .num{border-bottom:.065em solid currentColor;padding:0 .18em}
.frac .den{padding:0 .18em}
.sqrt{display:inline-flex;align-items:flex-start}
.sqrt .rad{font-size:1.12em;line-height:1;transform:translateY(.06em)}
.sqrt .sbody{border-top:.065em solid currentColor;padding:0 .12em 0 .05em}
.sqrt .sroot{font-size:.62em;align-self:flex-start;transform:translateY(-.15em);margin-right:-.3em}
.vec{position:relative;display:inline-block;padding-top:.35em}
.vec::before{content:"→";position:absolute;top:-.42em;left:0;right:0;text-align:center;font-size:.72em}
.oline{border-top:.065em solid currentColor;padding-top:.02em}
.hintbox{background:var(--chip);border-radius:10px;padding:10px 12px;margin:8px 0;font-size:14.5px;white-space:pre-wrap}
.ansbox{background:var(--card);border:1.5px solid var(--accent);border-radius:10px;padding:12px;margin:8px 0;white-space:pre-wrap;font-size:15px;line-height:1.85}
.tabs{display:flex;gap:6px;margin:8px 0}
.tabs button{flex:1;padding:9px;border-radius:9px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font-weight:800;font-size:14px}
.tabs button.on{border-color:var(--accent);color:var(--accent)}
.timer{text-align:center}
.timer .clock{font-size:42px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:.03em}
.timer.over .clock{color:var(--bad)}
.rubitem{display:flex;gap:9px;align-items:flex-start;padding:8px 6px;border-bottom:1px dashed var(--line);font-size:14.5px}
.rubitem input{width:21px;height:21px;margin-top:2px;flex:none}
.rubitem .pts{margin-left:auto;font-weight:800;color:var(--brand2);white-space:nowrap}
.mastery{display:flex;gap:8px}
.mastery button{flex:1;padding:12px 4px;border-radius:11px;border:2px solid var(--line);background:var(--card);color:var(--ink);font-size:14px;font-weight:800}
.mastery button.on{border-color:var(--brand2);background:var(--chip)}
.score{font-size:20px;font-weight:800}
table.cal{width:100%;border-collapse:collapse;table-layout:fixed}
table.cal td,table.cal th{border:1px solid var(--line);text-align:center;padding:5px 2px;font-size:13px;height:52px;vertical-align:top}
table.cal td.day{cursor:pointer;background:var(--card)}
table.cal td.today{outline:2.5px solid var(--brand2);outline-offset:-2.5px}
table.cal td .mk{font-size:15px;font-weight:800}
table.cal td .due{font-size:10.5px;color:var(--bad);font-weight:800}
table.cal td.dim{color:var(--sub);background:transparent}
.revitem{display:flex;gap:10px;align-items:center;padding:10px 6px;border-bottom:1px dashed var(--line);cursor:pointer}
.revitem .grow{flex:1}
.banner{background:#fdf3e0;border:1.5px solid var(--brand2);border-radius:10px;padding:10px 12px;font-size:14.5px;margin:10px 0}
body.dark .banner{background:#33301f}
#focusExit{display:none}
body.focus header,body.focus #courseBar,body.focus .navhide{display:none}
body.focus #focusExit{display:inline-block}
footer{max-width:860px;margin:0 auto;padding:6px 12px 26px;color:var(--sub);font-size:12.5px}
#printSheet{display:none}
@media print{
  header, #courseBar, main, footer{display:none !important}
  body{background:#fff}
  #printSheet{display:flex !important;align-items:flex-start;justify-content:center}
  @page{size:A4 portrait;margin:0}
}
.sheet{width:190mm;height:248mm;color:#111;background:#fff;padding:10mm 9mm;font-family:"Hiragino Mincho ProN","Yu Mincho",serif}
.sheet h1{font-size:15pt;margin:0 0 2mm;border-bottom:2.5px solid #274156;padding-bottom:2mm}
.sheet .meta{font-size:10.5pt;color:#333;margin-bottom:4mm}
.sheet .sec{font-weight:700;font-size:11pt;margin:4mm 0 1.5mm;color:#274156}
.sheet .stmt{font-size:11.5pt}
.sheet table{border-collapse:collapse;width:100%;font-size:10.5pt}
.sheet td,.sheet th{border:1px solid #888;padding:1.6mm 2mm;text-align:left}
.checkline{display:inline-block;width:50mm;border-top:1.6mm solid #274156;vertical-align:middle;margin-left:4mm}
</style>
</head>
<body>
<header>
  <div><h1>📐 日々の数学演習</h1><div class="sub">Daily Math Studio ― 1日1題、記述演習</div></div>
  <div class="sp"></div>
  <div id="streak" title="連続で解いた日数">🔥 0日</div>
  <button class="hbtn" id="themeBtn" onclick="toggleTheme()">🌙 黒板</button>
  <button class="hbtn" id="focusBtn" onclick="toggleFocus()">🎯 集中</button>
</header>
<button class="btn gold sm" id="focusExit" style="position:fixed;top:10px;right:10px;z-index:30" onclick="toggleFocus()">集中モードを終わる</button>
<div id="courseBar">
  <button data-course="rigaku" onclick="setCourse('rigaku')">大学受験 理系</button>
  <button data-course="bunkei" onclick="setCourse('bunkei')">大学受験 文系</button>

</div>
<main id="app"><div class="card"><h2>読み込み中…</h2></div></main>

  <button class="btn sub sm" onclick="updateApp()">最新の版に更新する</button>
  <span class="small">（更新しても記録は消えません）</span>
</footer>
<div id="printSheet"></div>
<script>
"use strict";
const APP_VER = "1.0.0";
const DATA = {"bunkei": {"2026-12-01": {"category": "二次関数", "minutes": 10, "statement": "周の長さが $48$ cm の長方形がある。縦の長さを $x$ cm として，面積を $S$ cm$^{2}$ とする。\n(1) $S$ を $x$ の式で表せ。また，$x$ の変域も書け。\n(2) 面積が最大になるのは縦・横が何 cm のときか。また，最大の面積を求めよ。", "hints": ["横の長さを $x$ で表すことから始める。周の半分が「縦＋横」になる。", "面積は $x$ の二次式になる。最大は平方完成で読む。", "正方形になるとき最大，という結論になるはず。変域の端ではないことも確認を。"], "answer": "(1) $S = -x^{2} + 24x$（$0 < x < 24$）　(2) 縦・横とも $12$ cm のとき，最大 $144$ cm$^{2}$", "solution": "横の長さは $24 - x$ cm だから，$S = x(24 - x) = -x^{2} + 24x$。変域は $0 < x < 24$。\n平方完成すると $S = -\\left( x - 12 \\right)^{2} + 144$。\nよって $x = 12$（縦・横とも $12$ cm の正方形）のとき最大で，最大の面積は $144$ cm$^{2}$。", "alt": "研究：周が一定の長方形は正方形のとき面積最大。これは相加・相乗平均の関係からも示せる（$x({L}-x) \\le \\left(\\frac{L}{2}\\right)^{2}$）。", "rubric": [{"item": "横の長さを $x$ で表し，変域を正しく書いている", "points": 3}, {"item": "平方完成して最大になる $x$ を求めている", "points": 3}, {"item": "計算が正確で、途中の式変形に誤りがない", "points": 2}, {"item": "最後に答え（結論）を明確に書いている", "points": 2}], "tpl": "bunkei_area_max", "date": "2026-12-01", "course": "bunkei"}, "2026-12-02": {"category": "二次関数", "minutes": 10, "statement": "2次方程式 $x^{2} + 2kx + 9 = 0$ が実数解をもつような定数 $k$ の値の範囲を求めよ。また，重解をもつときの $k$ と解も答えよ。", "hints": ["実数解の条件は判別式 $D \\ge 0$。係数が偶数のときは $D/4$ が楽。", "$k^{2} \\ge c$ 型の不等式は，数直線で外側の範囲になる。", "重解は $D = 0$ の境界。解は $x = -k$（公式の形から読む）。"], "answer": "$k \\le -3$，$3 \\le k$／重解：$k = 3$ のとき $x = -3$，$k = -3$ のとき $x = 3$", "solution": "判別式を $D$ とすると $\\frac{D}{4} = k^{2} - 9$。\n実数解をもつ条件は $\\frac{D}{4} \\ge 0$，すなわち $k^{2} \\ge 9$ より $k \\le -3$，$3 \\le k$。\n重解をもつのは $k = \\pm 3$ のときで，解は $x = -k$ だから，$k = 3$ のとき $x = -3$，$k = -3$ のとき $x = 3$。", "alt": "研究：判別式は放物線 $y = x^{2} + 2kx + c$ と $x$ 軸の共有点の個数とも対応する。$k$ を動かすと放物線が上下し，共有点が生まれたり消えたりする様子を図で確認しよう。", "rubric": [{"item": "判別式を正しく立てている", "points": 3}, {"item": "$k$ の不等式を解き，重解の場合も答えている", "points": 3}, {"item": "計算が正確で、途中の式変形に誤りがない", "points": 2}, {"item": "最後に答え（結論）を明確に書いている", "points": 2}], "tpl": "bunkei_discriminant", "date": "2026-12-02", "course": "bunkei"}, "2026-12-03": {"category": "図形と計量", "minutes": 8, "statement": "三角形 $ABC$ において，$b = CA = 6$，$c = AB = 6$，$A = 120^\\circ$ のとき，辺 $a = BC$ の長さを求めよ。", "hints": ["2辺とその間の角が分かっている。辺の長さを求める定理は余弦定理。", "$\\cos 60^\\circ = \\frac{1}{2}$，$\\cos 120^\\circ = -\\frac{1}{2}$ の符号に注意。", "最後は $a^{2}$ から $a$ に直す。長さだから正の値だけを取る。"], "answer": "$a = 6\\sqrt{3}$", "solution": "余弦定理より $a^{2} = b^{2} + c^{2} - 2bc\\cos A = 6^{2} + 6^{2} - 2 \\cdot 6 \\cdot 6 \\cdot \\left( -\\frac{1}{2} \\right) = 108$。\n$a > 0$ だから $a = 6\\sqrt{3}$。", "alt": "研究：$A = 90^\\circ$ のとき余弦定理は三平方の定理と一致する。余弦定理は三平方の定理の一般化と見ることができる。", "rubric": [{"item": "余弦定理を正しく適用している", "points": 3}, {"item": "$\\cos$ の値（符号を含む）を正しく使っている", "points": 3}, {"item": "計算が正確で、途中の式変形に誤りがない", "points": 2}, {"item": "最後に答え（結論）を明確に書いている", "points": 2}], "tpl": "bunkei_cos_rule", "date": "2026-12-03", "course": "bunkei"}, "2026-12-04": {"category": "ベクトル", "minutes": 8, "statement": "$\\vec{a} = (-2, 5)$，$\\vec{b} = (5, 2)$ のとき，内積 $\\vec{a} \\cdot \\vec{b}$ と，2つのベクトルのなす角 $\\theta$ を求めよ。", "hints": ["内積は成分同士の積の和。", "内積が0になることと垂直であることは同値。", "なす角は $\\cos\\theta = \\frac{\\vec{a} \\cdot \\vec{b}}{|\\vec{a}||\\vec{b}|}$ の式でも確認できる。"], "answer": "内積 $0$，$\\theta = 90^\\circ$", "solution": "内積は $\\vec{a} \\cdot \\vec{b} = -2 \\cdot 5 + 5 \\cdot 2 = 0$。\n内積が $0$ だから，2つのベクトルは垂直で，$\\theta = 90^\\circ$。", "alt": "研究：内積の符号で，なす角が鋭角（正）・直角（0）・鈍角（負）と判定できる。図形の垂直条件の証明に使うのが定番。", "rubric": [{"item": "内積を成分から正しく計算している", "points": 3}, {"item": "内積＝0と垂直の関係を使って角度を答えている", "points": 3}, {"item": "計算が正確で、途中の式変形に誤りがない", "points": 2}, {"item": "最後に答え（結論）を明確に書いている", "points": 2}], "tpl": "bunkei_inner_product", "date": "2026-12-04", "course": "bunkei"}, "2026-12-05": {"category": "確率", "minutes": 8, "statement": "2個のさいころを同時に投げるとき，出る目の和が $6$ になる確率を求めよ。", "hints": ["2個のさいころは区別して考える（表をかくと36マス）。", "和が目標になる組み合わせを，片方の目を1から順に固定して数える。", "最後は約分を忘れずに。"], "answer": "$\\frac{5}{36}$", "solution": "全体は $6 \\times 6 = 36$ 通りで，どの目も同様に確からしい。\n和が $6$ になるのは $(1, 5, 2, 4, 3, 3, 4, 2, 5, 1)$ の $5$ 通り。\nよって確率は $\\ , "2026-12-08": {"category": "微分", "minutes": 12, "statement": "関数 $f(x) = x^{3} - 9x^{2} + 15x + 3$ の極値を求めよ。", "hints": ["極値は微分して $f'(x) = 0$ の解から探す。", "$f'(x)$ を因数分解すると増減の符号が見える。因数分解できないときは解の公式。", "極大・極小の判定は増減表で。$x$ の値だけでなく，極値（$y$ の値）まで書く。"], "answer": "極大値 $10$（$x = 1$），極小値 $-22$（$x = 5$）", "solution": "$f'(x) = 3x^{2} + -18x + 15 = 3(x - 1)(x - 5)$。\n増減表より，$x = 1$ で極大値 $f(1) = 10$，$x = 5$ で極小値 $f(5) = -22$ をとる。", "alt": "研究：三次関数のグラフは点対称（変曲点が中心）。極大値と極小値の平均が変曲点の $y$ 座標になることを確かめてみよう。", "rubric": [{"item": "導関数を正しく求め，$f'(x)=0$ を解いている", "points": 3}, {"item": "増減表（または符号の判定）から極大・極小を判定している", "points": 3}, {"item": "計算が正確で、途中の式変形に誤りがない", "points": 2}, {"item": "最後に答え（結論）を明確に書いている", "points": 2}], "tpl": "bunkei_cubic_extremum", "date": "2026-12-08", "course": "bunkei"}, "2026-12-09": {"category": "データの分析", "minutes": 10, "statement": "5人の生徒のテストの得点が $1, 1, 3, 3, 2$ 点であった。平均値と分散を求めよ。", "hints": ["分散は「偏差の2乗の平均」。まず平均を出す。", "偏差の合計が0になることを検算に使える。", "分散には「2乗の平均 − 平均の2乗」という別公式もある。"], "answer": "平均値 $2$ 点，分散 $\\frac{4}{5}$", "solution": "平均値は $\\frac{10}{5} = 2$ 点。\n各データの偏差は -1, -1, 1, 1, 0 で，偏差の2乗の平均が分散になる。\n分散は $\\frac{(-1)^{2} + (-1)^{2} + (1)^{2} + (1)^{2} + (0)^{2}}{5} = \\frac{4}{5}$。", "alt": "別解：分散は $\\overline{x^{2}} - (\\overline{x})^{2}$ でも計算できる。2乗の和を先に求める方法で検算してみよう。", "rubric": [{"item": "平均値を正しく求めている", "points": 3}, {"item": "偏差の2乗の平均として分散を計算している", "points": 3}, {"item": "計算が正確で、途中の式変形に誤りがない", "points": 2}, {"item": "最後に答え（結論）を明確に書いている", "points": 2}], "tpl": "bunkei_data_variance", "date": "2026-12-09", "course": "bunkei"}, "2026-12-10": {"category": "積分", "minutes": 12, "statement": "放物線 $y = x^{2}$ と直線 $y = -3x$ で囲まれた部分の面積を求めよ。", "hints": ["囲まれた面積は，まず交点を求めることから。", "「直線 − 放物線」の積分。区間内で直線が上にあることを確認。", "差が $-(x-\\alpha)(x-\\beta)$ の形なら1/6公式が使える。"], "answer": "$\\frac{9}{2}$", "solution": "交点は $x^{2} = -3x$，すなわち $x^{2} - -3x + 0 = 0$ を解いて $x = -3, 0$。\n区間では直線が上にあるので，面積は $\\int_{-3}^{0} \\{ (-3x) - x^{2} \\} dx$。\n被積分関数が $-(x - -3)(x - 0)$ と因数分解でき，1/6公式より $\\frac{1}{6} ory": "微分", "minutes": 12, "statement": "関数 $f(x) = x^{3} - 3x^{2} - 9x - 2$ の極値を求めよ。", "hints": ["極値は微分して $f'(x) = 0$ の解から探す。", "$f'(x)$ を因数分解すると増減の符号が見える。因数分解できないときは解の公式。", "極大・極小の判定は増減表で。$x$ の値だけでなく，極値（$y$ の値）まで書く。"], "answer": "極大値 $3$（$x = -1$），極小値 $-29$（$x = 3$）", "solution": "$f'(x) = 3x^{2} + -6x + -9 = 3(x - -1)(x - 3)$。\n増減表より，$x = -1$ で極大値 $f(-1) = 3$，$x = 3$ で極小値 $f(3) = -29$ をとる。", "alt": "研究：三次関数のグラフは点対称（変曲点が中心）。極大値と極小値の平均が変曲点の $y$ 座標になることを確かめてみよう。", "rubric": [{"item": "導関数を正しく求め，$f'(x)=0$ を解いている", "points": 3}, {"item": "増減表（または符号の判定）から極大・極小を判定している", "points": 3}, {"item": "計算が正確で、途中の式変形に誤りがない", "points": 2}, {"item": "最後に答え（結論）を明確に書いている", "points": 2}], "tpl": "bunkei_cubic_extremum", "date": "2026-12-18", "course": "bunkei"}, "2026-12-19": {"category": "データの分析", "minutes": 10, "statement": "5人の生徒のテストの得点が $1, 8, 3, 2, 6$ 点であった。平均値と分散を求めよ。", "hints": ["分散は「偏差の2乗の平均」。まず平均を出す。", "偏差の合計が0になることを検算に使える。", "分散には「2乗の平均 − 平均の2乗」という別公式もある。"], "answer": "平均値 $4$ 点，分散 $\\frac{34}{5}$", "solution": "平均値は $\\frac{20}{5} = 4$ 点。\n各データの偏差は -3, 4, -1, -2, 2 で，偏差の2乗の平均が分散になる。\n分散は $\\frac{(-3)^{2} + (4)^{2} + (-1)^{2} + (-2)^{2} + (2)^{2}}{5} = \\frac{34}{5}$。", "alt": "別解：分散は $\\overline{x^{2}} - (\\overline{x})^{2}$ でも計算できる。2乗の和を先に求める方法で検算してみよう。", "rubric": [{"item": "平均値を正しく求めている", "points": 3}, {"item": "偏差の2乗の平均として分散を計算している", "points": 3}, {"item": "計算が正確で、途中の式変形に誤りがない", "points": 2}, {"item": "最後に答え（結論）を明確に書いている", "points": 2}], "tpl": "bunkei_data_variance", "date": "2026-12-19", "course": "bunkei"}, "2026-12-20": {"category": "積分", "minutes": 12, "statement": "放物線 $y = x^{2}$ と直線 $y = 2x + 3$ で囲まれた部分の面積を求めよ。", "hints": ["囲まれた面積は，まず交点を求めることから。", "「直線 − 放物線」の積分。区間内で直線が上にあることを確認。", "差が $-(x-\\alpha)(x-\\beta)$ の形なら1/6公式が使える。"], "answer": "$\\frac{32}{3}$", "solution": "交点は $x^{2} = 2x + 3$，すなわち $x^{2} - 2x + 3 = 0$ を解いて $x = -1, 3$。\n区間では直線が上にあるので，面積は $\\int_{-1}^{3} \\{ (2x + 3) - x^{2} \\} dx$。\n被積分関数が $-(x - -1)(x - 3)$ と因数分解でき，1/6公式より $\\frac{1}{6}(3 - -1)^{3} = \\frac{32}{3}$。", "alt": "別解：1/6公式を使わずに素直に積分しても同じ値になる。公式は検算用に使うと安心。", "rubric": [{"item": "交点の $x$ 座標を正しく求めている", "points": 3}, {"item": "上下関係を判断して差の積分を立式している", "points": 3}, {"item": "計算が正確で、途中の式変形に誤りがない", "points": 2}, {"item": "最後に答え（結論）を明確に書いている", "points": 2}], "tpl": "bunkei_line_parabola_area", "figure": {"type": "parabola_line", "a": 1, "b": 0, "c": 0, "m": 2, "n": 3, "lo": -1, "hi": 3}, "date": "2026-12-20", "course": "bunkei"}, "2026-12-21": {"category": "指数・対数", "minutes": 10, "statement": "不等式 $\\log_{5}(x - 1) \\le 2$ を解け。", "hints": ["対数の不等式でも，まず真数条件を書く。", "底が1より大きいか小さいかで，不等号の向きが決まる。今回は底が1より大きい。", "最後に真数条件との共通範囲をとる。"], "answer": "$1 < x \\le 26$", "solution": "真数条件は $x - 1 > 0$，すなわち $x > 1$。\n底 $5$ は $1$ より大きいので，不等号の向きは変わらず $x - 1 \\le 5^{2} = 25$，つまり $x \\le 26$。\n真数条件と合わせて $1 < x \\le 26$。", "alt": "研究：底が $\\frac{1}{2}$ のような1より小さい数だと不等号が逆転する。向きを間違える典型的な減点ポイントなので，底の大きさの確認を習慣に。", "rubric": [{"item": "真数条件を明示している", "points": 3}, {"item": "底と1の大小を見て不等号の向きを正しく扱っている", "points": 3}, {"item": "計算が正確で、途中の式変形に誤りがない", "points": 2}, {"item": "最後に答え（結論）を明確に書いている", "points": 2}], "tpl": "bunkei_log_ineq", "date": "2026-12-21", "course": "bunkei"}, "2026-12-22": {"category": "整数の性質", "minutes": 8, "statement": "$8$ 分間隔で出発するバスと，$9$ 分間隔で出発するバスが，午前9時に同時に出発した。\n次に同時に出発するのは何分後か。また，同時出発は午前9時から数えて $2$ 回目はいつ（何時何分）か。", "hints": ["「同時」は最小公倍数の合図。", "最小公倍数は素因数分解で求める。", "回目の問題は「間隔の数＝回目−1」に注意。最初（9時）が1回目。"], "answer": "$72$ 分後／午前 $10$ 時 $12$ 分", "solution": "同時出発の間隔は $8$ と $9$ の最小公倍数。$8$ と $9$ の最小公倍数は $72$ だから，次は $72$ 分後。\n$2$ 回目の同時出発は，最初から $72 \\times 1 = 72$ 分後なので，午前 $10$ 時 $12$ 分。", "alt": "研究：2つの数の積と最大公約数・最小公倍数には $a \\times b = \\gcd(a,b) \\times \\mathrm{lcm}(a,b)$ の関係がある。", "rubric": [{"item": "最小公倍数を正しく求めている", "points": 3}, {"item": "回目と間隔の数のずれ（−1）に注意して時刻を出している", "points": 3}, {"item": "計算が正確で、途中の式変形に誤りがない", "points": 2}, {"item": "最後に答え（結論）を明確に書いている", "points": 2}], "tpl": "bunkei_lcm_word", "date": "2026-12-22", "course": "bunkei"}, "2026-12-23": {"category": "二次関数", "minutes": 10, "statement": "2次方程式 $x^{2} + 2kx + 4 = 0$ が実数解をもつような定数 $k$ の値の範囲を求めよ。また，重解をもつときの $k$ と解も答えよ。", "hints": ["実数解の条件は判別式 $D \\ge 0$。係数が偶数のときは $D/4$ が楽。", "$k^{2} \\ge c$ 型の不等式は，数直線で外側の範囲になる。", "重解は $D = 0$ の境界。解は $x = -k$（公式の形から読む）。"], "answer": "$k \\le -2$，$2 \\le k$／重解：$k = 2$ のとき $x = -2$，$k = -2$ のとき $x = 2$", "solution": "判別式を $D$ とすると $\\frac{D}{4} = k^{2} - 4$。\n実数解をもつ条件は $\\frac{D}{4} \\ge 0$，すなわち $k^{2} \\ge 4$ より $k \\le -2$，$2 \\le k$。\n重解をもつのは $k = \\pm 2$ のときで，解は $x = -k$ だから，$k = 2$ のとき $x = -2$，$k = -2$ のとき $x = 2$。", "alt": "研究：判別式は放物線 $y = x^{2} + 2kx + c$ と $x$ 軸の共有点の個数とも対応する。$k$ を動かすと放物線が上下し，共有点が生まれたり消えたりする様子を図で確認しよう。", "rubric": [{"item": "判別式を正しく立てている", "points": 3}, {"item": "$k$ の不等式を解き，重解の場合も答えている", "points": 3}, {"item": "計算が正確で、途中の式変形に誤りがない", "points": 2}, {"item": "最後に答え（結論）を明確に書いている", "points": 2}], "tpl": "bunkei_discriminant", "date": "2026-12-23", "course": "bunkei"}, "2026-12-24": {"category": "図形と計量", "minutes": 8, "statement": "三角形 $ABC$ において，$b = CA = 6$，$c = AB = 8$，$A = 120^\\circ$ のとき，辺 $a = BC$ の長さを求めよ。", "hints": ["2辺とその間の角が分かっている。辺の長さを求める定理は余弦定理。", "$\\cos 60^\\circ = \\frac{1}{2}$，$\\cos 120^\\circ = -\\frac{1}{2}$ の符号に注意。", "最後は $a^{2}$ から $a$ に直す。長さだから正の値だけを取る。"], "answer": "$a = 2\\sqrt{37}$", "solution": "余弦定理より $a^{2} = b^{2} + c^{2} - 2bc\\cos A = 6^{2} + 8^{2} - 2 \\cdot 6 \\cdot 8 \\cdot \\left( -\\frac{1}{2} \\right) = 148$。\n$a > 0$ だから $a = 2\\sqrt{37}$。", "alt": "研究：$A = 90^\\circ$ のとき余弦定理は三平方の定理と一致する。余弦定理は三平方の定理の一般化と見ることができる。", "rubric": [{"item": "余弦定理を正しく適用している", "points": 3}, {"item": "$\\cos$ の値（符号を含む）を正しく使っている", "points": 3}, {"item": "計算が正確で、途中の式変形に誤りがない", "points": 2}, {"item": "最後に答え（結論）を明確に書いている", "points": 2}], "tpl": "bunkei_cos_rule", "date": "2026-12-24", "course": "bunkei"}, "2026-12-25": {"category": "ベクトル", "minutes": 8, "statement": "$\\vec{a} = (5, 3)$，$\\vec{b} = (-3, 5)$ のとき，内積 $\\vec{a} \\cdot \\vec{b}$ と，2つのベクトルのなす角 $\\theta$ を求めよ。", "hints": ["内積は成分同士の積の和。", "内積が0になることと垂直であることは同値。", "なす角は $\\cos\\theta = \\frac{\\vec{a} \\cdot \\vec{b}}{|\\vec{a}||\\vec{b}|}$ の式でも確認できる。"], "answer": "内積 $0$，$\\theta = 90^\\circ$", "solution": "内積は $\\vec{a} \\cdot \\vec{b} = 5 \\cdot -3 + 3 \\cdot 5 = 0$。\n内積が $0$ だから，2つのベクトルは垂直で，$\\theta = 90^\\circ$。", "alt": "研究：内積の符号で，なす角が鋭角（正）・直角（0）・鈍角（負）と判定できる。図形の垂直条件の証明に使うのが定番。", "rubric": [{"item": "内積を成分から正しく計算している", "points": 3}, {"item": "内積＝0と垂直の関係を使って角度を答えている", "points": 3}, {"item": "計算が正確で、途中の式変形に誤りがない", "points": 2}, {"item": "最後に答え（結論）を明確に書いている", "points": 2}], "tpl": "bunkei_inner_product", "date": "2026-12-25", "course": "bunkei"}, "2026-12-26": {"category": "確率", "minutes": 8, "statement": "2個のさいころを同時に投げるとき，出る目の和が $9$ になる確率を求めよ。", "hints": ["2個のさいころは区別して考える（表をかくと36マス）。", "和が目標になる組み合わせを，片方の目を1から順に固定して数える。", "最後は約分を忘れずに。"], "answer": "$\\frac{1}{9}$", "solution": "全体は $6 \\times 6 = 36$ 通りで，どの目も同様に確からしい。\n和が $9$ になるのは $(3, 6, 4, 5, 5, 4, 6, 3)$ の $4$ 通り。\nよって確率は $\\frac{4}{36} = \\frac{1}{9}$。", "alt": "研究：目の和の分布は7を中心に対称で，7が最も出やすい（6通り）。表の対角線の長さがそのまま場合の数になる。", "rubric": [{"item": "全体の場合の数36通りを正しく設定している", "points": 3}, {"item": "和が目標になる場合を漏れなく数えている", "points": 3}, {"item": "計算が正確で、途中の式変形に誤りがない", "points": 2}, {"item": "最後に答え（結論）を明確に書いている", "points": 2}], "tpl": "bunkei_dice_prob", "date": "2026-12-26", "course": "bunkei"}, "2026-12-27": {"category": "数列", "minutes": 8, "statement": "初項 $4$，公比 $3$ の等比数列の，初項から第 $7$ 項までの和を求めよ。", "hints": ["和の公式に当てはめるだけだが，公比が分数・負のときに計算ミスが出やすい。", "$r^{n}$ を先に計算してから代入すると楽。", "項を数項書き出して，答えの大きさが合うか確かめよう。"], "answer": "$4372$", "solution": "等比数列の和の公式 $S = \\frac{a(1 - r^{n})}{1 - r}$ に $a = 4$，$r = 3$，$n = 7$ を代入する。\n$r^{7} = 2187$ だから，$S = 4372$。", "alt": "研究：$|r| < 1$ のとき $n \\to \\infty$ で和は $\\frac{a}{1-r}$ に近づく（無限等比級数）。今回の $r$ がその条件を満たすか確認してみよう。", "rubric": [{"item": "等比数列の和の公式を正しく使っている", "points": 3}, {"item": "公比の累乗の計算が正確", "points": 3}, {"item": "計算が正確で、途中の式変形に誤りがない", "points": 2}, {"item": "最後に答え（結論）を明確に書いている", "points": 2}], "tpl": "bunkei_geometric_sum", "date": "2026-12-27", "course": "bunkei"}, "2026-12-28": {"category": "図形の性質", "minutes": 10, "statement": "円 $O$ の周上に3点 $A, B, C$ があり，弧 $BC$（点 $A$ を含まない側）に対する中心角が $180^\\circ$ である。\n円周角 $\\angle BAC$ の大きさを求めよ。また，点 $A$ における円の接線と直線 $AB$ のなす角について，弦と接線の関係から分かることを述べよ。", "hints": ["円周角は中心角の半分（同じ弧を見るとき）。", "接線の問題は接弦定理：「接線と弦のなす角＝反対側の弧の円周角」。", "どの弧に対する角かをはっきりさせてから計算する。"], "answer": "$\\angle BAC = 90^\\circ$", "solution": "円周角の定理より，円周角は中心角の半分だから $\\angle BAC = \\frac{1}{2} \\times 180^\\circ = 90^\\circ$。\n接線と弦のなす角（接弦定理）は，その弦の弧に対する円周角と等しい。したがって接線と $AB$ のなす角は，弧 $AB$ に対する円周角と等しくなる。", "alt": "研究：接弦定理は円周角の定理の極限として理解できる（接線は弦の端点を円周上で近づけたもの）。", "rubric": [{"item": "円周角の定理を正しく使っている", "points": 3}, {"item": "接弦定理の内容を正しく述べている", "points": 3}, {"item": "計算が正確で、途中の式変形に誤りがない", "points": 2}, {"item": "最後に答え（結論）を明確に書いている", "points": 2}], "tpl": "bunkei_circle_angle", "date": "2026-12-28", "course": "bunkei"}, "2026-12-29": {"category": "微分", "minutes": 12, "statement": "関数 $f(x) = x^{3} - 6x^{2} + 9x + 1$ の極値を求めよ。", "hints": ["極値は微分して $f'(x) = 0$ の解から探す。", "$f'(x)$ を因数分解すると増減の符号が見える。因数分解できないときは解の公式。", "極大・極小の判定は増減表で。$x$ の値だけでなく，極値（$y$ の値）まで書く。"], "answer": "極大値 $5$（$x = 1$），極小値 $1$（$x = 3$）", "solution": "$f'(x) = 3x^{2} + -12x + 9 = 3(x - 1)(x - 3)$。\n増減表より，$x = 1$ で極大値 $f(1) = 5$，$x = 3$ で極小値 $f(3) = 1$ をとる。", "alt": "研究：三次関数のグラフは点対称（変曲点が中心）。極大値と極小値の平均が変曲点の $y$ 座標になることを確かめてみよう。", "rubric": [{"item": "導関数を正しく求め，$f'(x)=0$ を解いている", "points": 3}, {"item": "増減表（または符号の判定）から極大・極小を判定している", "points": 3}, {"item": "計算が正確で、途中の式変形に誤りがない", "points": 2}, {"item": "最後に答え（結論）を明確に書いている", "points": 2}], "tpl": "bunkei_cubic_extremum", "date": "2026-12-29", "course": "bunkei"}, "2026-12-30": {"category": "データの分析", "minutes": 10, "statement": "5人の生徒のテストの得点が $8, 2, 9, 8, 8$ 点であった。平均値と分散を求めよ。", "hints": ["分散は「偏差の2乗の平均」。まず平均を出す。", "偏差の合計が0になることを検算に使える。", "分散には「2乗の平均 − 平均の2乗」という別公式もある。"], "answer": "平均値 $7$ 点，分散 $\\frac{32}{5}$", "solution": "平均値は $\\frac{35}{5} = 7$ 点。\n各データの偏差は 1, -5, 2, 1, 1 で，偏差の2乗の平均が分散になる。\n分散は $\\frac{(1)^{2} + (-5)^{2} + (2)^{2} + (1)^{2} + (1)^{2}}{5} = \\frac{32}{5}$。", "alt": "別解：分散は $\\overline{x^{2}} - (\\overline{x})^{2}$ でも計算できる。2乗の和を先に求める方法で検算してみよう。", "rubric": [{"item": "平均値を正しく求めている", "points": 3}, {"item": "偏差の2乗の平均として分散を計算している", "points": 3}, {"item": "計算が正確で、途中の式変形に誤りがない", "points": 2}, {"item": "最後に答え（結論）を明確に書いている", "points": 2}], "tpl": "bunkei_data_variance", "date": "2026-12-30", "course": "bunkei"}, "2026-12-31": {"category": "積分", "minutes": 12, "statement": "放物線 $y = x^{2}$ と直線 $y = -2x$ で囲まれた部分の面積を求めよ。", "hints": ["囲まれた面積は，まず交点を求めることから。", "「直線 − 放物線」の積分。区間内で直線が上にあることを確認。", "差が $-(x-\\alpha)(x-\\beta)$ の形なら1/6公式が使える。"], "answer": "$\\frac{4}{3}$", "solution": "交点は $x^{2} = -2x$，すなわち $x^{2} - -2x + 0 = 0$ を解いて $x = -2, 0$。\n区間では直線が上にあるので，面積は $\\int_{-2}^{0} \\{ (-2x) - x^{2} \\} dx$。\n被積分関数が $-(x - -2)(x - 0)$ と因数分解でき，1/6公式より $\\frac{1}{6}(0 - -2)^{3} = \\frac{4}{3}$。", "alt": "別解：1/6公式を使わずに素直に積分しても同じ値になる。公式は検算用に使うと安心。", "rubric": [{"item": "交点の $x$ 座標を正しく求めている", "points": 3}, {"item": "上下関係を判断して差の積分を立式している", "points": 3}, {"item": "計算が正確で、途中の式変形に誤りがない", "points": 2}, {"item": "最後に答え（結論）を明確に書いている", "points": 2}], "tpl": "bunkei_line_parabola_area", "figure": {"type": "parabola_line", "a": 1, "b": 0, "c": 0, "m": -2, "n": 0, "lo": -2, "hi": 0}, "date": "2026-12-31", "course": "bunkei"}}, "koko": {"2026-12-01": {"category": "式の計算", "minutes": 6, "statement": "次の式を因数分解せよ。$x^{2} - 7x + 12$", "hints": ["定数項の約数の組を挙げて，和が $x$ の係数になる組を探す。", "符号の組み合わせに注意。積が正で和が負なら，2つとも負の数。", "答えは展開して検算できる。因数分解は必ず検算しよう。"], "answer": "$(x - 4)(x - 3)$", "solution": "定数項 $12$ の約数の組で，和が $-7$ になるのは $4$ と $3$（符号に注意）。\nよって $(x - 4)(x - 3)$。展開して元の式に戻ることを確かめよう。", "alt": "研究：因数分解は二次方程式を解く道具にもなる。$(x - r_1)(x - r_2) = 0$ の解は $x = r_1, r_2$。", "rubric": [{"item": "定数項の約数から，積と和の合う組を見つけている", "points": 3}, {"item": "符号の処理が正しい", "points": 3}, {"item": "計算が正確で、途中の式変形に誤りがない", "points": 2}, {"item": "最後に答え（結論）を明確に書いている", "points": 2}], "tpl": "koko_factorize", "date": "2026-12-01", "course": "koko"}, "2026-12-02": {"category": "確率", "minutes": 8, "statement": "当たり $2$ 本と，はずれ $5$ 本が入ったくじがある。\n(1) 1回引いて当たる確率を求めよ。\n(2) 1回引いたくじを元に戻さずにもう1回引くとき，2回とも当たる確率を求めよ。", "hints": ["確率は「当たりの場合 ÷ 全体の場合」。", "(2)は元に戻さないので，2回目は全体も当たりも1つ減る。", "2回続けて起こる確率は，それぞれの確率の積。"], "answer": "(1) $\\frac{2}{7}$　(2) $\\frac{1}{21}$", "solution": "(1) 全体 $7$ 本のうち当たり $2$ 本だから，$\\frac{2}{7} = \\frac{2}{7}$。\n(2) 1回目のあと全体は $6$ 本，当たりは $1$ 本になる。積の法則で $\\frac{2}{7} \\times \\frac{1}{6} = \\frac{1}{21}$。", "alt": "研究：元に戻す場合は2回目も同じ確率になる。「戻す・戻さない」の読み取りが確率の文章題の最大の分かれ目。", "rubric": [{"item": "全体と当たりの数を正しく数えている", "points": 3}, {"item": "元に戻さない場合の数の変化を扱い，積の法則を使っている", "points": 3}, {"item": "計算が正確で、途中の式変形に誤りがない", "points": 2}, {"item": "最後に答え（結論）を明確に書いている", "points": 2}], "tpl": "koko_lottery_prob", "date": "2026-12-02", "course": "koko"}, "2026-12-03": {"category": "関数と図形", "minutes": 10, "statement": "座標平面上に3点 $O(0, 0)$，$A(3, 0)$，$B(3, 5)$ がある。\n(1) 三角形 $OAB$ の面積を求めよ。\n(2) 点 $B$ を通り，三角形 $OAB$ の面積を2等分する直線と $x$ 軸との交点の座標を求めよ。", "hints": ["まず3点の位置を図に描く。直角三角形になっていることに気づく。", "面積の2等分のキーワードは「中点」。頂点と対辺の中点を結ぶ。", "中点の座標は，両端の平均。"], "answer": "(1) $\\frac{15}{2}$　(2) $(\\frac{3}{2}, 0)$", "solution": "(1) $OA = 3$，$AB = 5$ の直角三角形だから，面積は $3 \\times 5 \\div 2 = \\frac{15}{2}$。\n(2) 三角形の面積の2等分は，頂点から対辺の中点に引いた線（中線）でできる。辺 $OA$ の中点は $(\\frac{3}{2}, 0)$ だから，求める交点は $(\\frac{3}{2}, 0)$。", "alt": "研究：中線は三角形を面積の等しい2つに分ける。これは中線定理や重心（中線を2:1に分ける点）の学習につながる。", "rubric": [{"item": "三角形の形を正しく捉えて面積を計算している", "points": 3}, {"item": "中線による面積二等分の考え方を使っている", "points": 3}, {"item": "計算が正確で、途中の式変形に誤りがない", "points": 2}, {"item": "最後に答え（結論）を明確に書いている", "points": 2}], "tpl": "koko_area_bisect", "date": "2026-12-03", "course": "koko"}, "2026-12-04": {"category": "三平方の定理", "minutes": 8, "statement": "座標平面上の2点 $A(1, 2)$，$B(3, 7)$ の間の距離を求めよ。", "hints": ["2点間の距離は，座標の差を2辺とする直角三角形の斜辺。", "$x$ の差と $y$ の差をそれぞれ数える（引き算の符号に注意）。", "最後に根号を簡単にできるか確認する。"], "answer": "$\\sqrt{29}$", "solution": "2点の $x$ 座標の差は $2$，$y$ 座標の差は $5$。この差を2辺とする直角三角形を考えると，斜辺が求める距離になる。\n三平方の定理より，距離は $\\sqrt{2^{2} + 5^{2}} = \\sqrt{29} = \\sqrt{29}$。", "alt": "研究：この計算は高校の「2点間の距離の公式」$\\sqrt{(x_2-x_1)^{2} + (y_2-y_1)^{2}}$ の中身そのもの。", "rubric": [{"item": "座標の差から直角三角形を作っている", "points": 3}, {"item": "三平方の定理を使い，根号を簡単にしている", "points": 3}, {"item": "計算が正確で、途中の式変形に誤りがない", "points": 2}, {"item": "最後に答え（結論）を明確に書いている", "points": 2}], "tpl": "koko_pythagoras_dist", "date": "2026-12-04", "course": "koko"}, "2026-12-05": {"category": "一次関数", "minutes": 12, "statement": "2直線 $y = \\frac{1}{2}x + 4$ と $y = -\\frac{1}{2}x + 3$ について，次の問いに答えよ。\n(1) 交点の座標を求めよ。\n(2) 2直線と $x$ 軸で囲まれた三角形の面積を求めよ。", "hints": ["交点は連立方程式の解。2つの $y$ の式を等しいと置く。", "(2)の三角形の頂点は，交点と，2直線が $x$ 軸と交わる点。", "底辺は $x$ 軸上にとると，高さは交点の $y$ 座標（の絶対値）になる。"], "answer": "(1) $(-1, \\frac{7}{2})$　(2) $\\frac{49}{2}$", "solution": "(1) 2式を連立する。$\\frac{1}{2}x + 4 = -\\frac{1}{2}x + 3$ を解くと $x = -1$，これを一方に代入して $y = \\frac{7}{2}$。交点は $(-1, \\frac{7}{2})$。\n(2) 各直線と $x$ 軸の交点は $(-8, 0)$ と $(6, 0)$。底辺の長さは $14$，高さは交点の $y$ 座標の絶対値 $\\frac{7}{2}$。\n面積は $14 \\times \\frac{7}{2} \\div 2 = \\frac{49}{2}$。", "alt": "研究：面積は「底辺×高さ÷2」。底辺を $x$ 軸上にとるのがコツで，座標平面の面積問題の多くはこの形に帰着する。", "rubric": [{"item": "連立方程式を解いて交点を求めている", "points": 3}, {"item": "底辺と高さを正しく読み取り，面積を計算している", "points": 3}, {"item": "計算が正確で、途中の式変形に誤りがない", "points": 2}, {"item": "最後に答え（結論）を明確に書いている", "points": 2}], "tpl": "koko_linear_intersect", "figure": {"type": "two_lines", "m1": 0.5, "b1": 4.0, "m2": -0.5, "b2": 3.0}, "date": "2026-12-05", "course": "koko"}, "2026-12-06": {"category": "連立方程式", "minutes": 10, "statement": "$1$ 個 $100$ 円の品物 $A$ と，$1$ 個 $110$ 円の品物 $B$ を，合わせて $10$ 個買うと，代金は全部で $1050$ 円になった。\n$A, B$ をそれぞれ何個買ったか求めよ。", "hints": ["分からないものは2つ。$x, y$ と置いて，式も2つ立てる（個数の式と代金の式）。", "加減法か代入法で1文字消す。", "答えは問題の場面に合うか（個数が正の整数か）を確認する。"], "answer": "$A$ が $5$ 個，$B$ が $5$ 個", "solution": "$A$ を $x$ 個，$B$ を $y$ 個とすると，個数について $x + y = 10$，代金について $100x + 110y = 1050$。\n1つ目の式を $\\times 110$ して引く（加減法）と $x = 5$ が分かり，$y = 5$。\n検算：$100 \\times 5 + 110 \\times 5 = 1050$ 円で合う。", "alt": "研究：連立方程式の解は，2直線の交点の座標でもある。グラフで考えると「式を2つ立てる」意味が見える。", "rubric": [{"item": "個数と代金の2つの式を正しく立てている", "points": 3}, {"item": "加減法・代入法で正しく解いている", "points": 3}, {"item": "計算が正確で、途中の式変形に誤りがない", "points": 2}, {"item": "最後に答え（結論）を明確に書いている", "points": 2}], "tpl": "koko_renritsu_word", "date": "2026-12-06", "course": "koko"}, "2026-12-07": {"category": "二次関数", "minutes": 10, "statement": "関数 $y = 3x^{2}$ について，次の問いに答えよ。\n(1) $x$ の変域が $-2 \\le x \\le 4$ のとき，$y$ の変域を求めよ。\n(2) $x$ が $-2$ から $4$ まで増加するときの変化の割合を求めよ。", "hints": ["$y = ax^{2}$ は $x = 0$ で最小（$a>0$）。変域に0が入るかがポイント。", "端点の値と頂点（原点）の値を比べて変域を決める。", "変化の割合は「$y$ の増加量 ÷ $x$ の増加量」。一次関数と違って一定ではない。"], "answer": "(1) $0 \\le y \\le 48$　(2) $6$", "solution": "(1) $x = 0$ が変域に含まれるので，$y$ の最小値は $x = 0$ のときの $0$。端点では $x = -2$ で $y = 12$，$x = 4$ で $y = 48$。よって変域は $0 \\le y \\le 48$。\n(2) 変化の割合は $\\frac{48 - 12}{4 - -2} = 6$。", "alt": "研究：変化の割合は $a(x_1 + x_2)$ と整理できる。2点の平均と関係する形で，後の「微分」につながる考え方。", "rubric": [{"item": "変域に $x=0$ が含まれることに気づき，最小値を正しく求めている", "points": 3}, {"item": "変化の割合を定義どおりに計算している", "points": 3}, {"item": "計算が正確で、途中の式変形に誤りがない", "points": 2}, {"item": "最後に答え（結論）を明確に書いている", "points": 2}], "tpl": "koko_parabola_range", "figure": {"type": "parabola", "a": 3.0, "b": 0, "c": 0, "lo": -3, "hi": 5}, "date": "2026-12-07", "course": "koko"}, "2026-12-08": {"category": "平面図形", "minutes": 8, "statement": "円 $O$ において，弧 $AB$ に対する中心角が $220^\\circ$ である。\n(1) 同じ弧 $AB$ に対する円周角の大きさを求めよ。\n(2) 弧 $AB$ の反対側（大きいほうの弧）に対する円周角の大きさを求めよ。", "hints": ["円周角＝中心角の半分（同じ弧に対して）。", "(2)は一周360°から引いて，反対側の弧の中心角を出す。", "円に内接する四角形の対角の和は180°，という見方でも(2)が求まる。"], "answer": "(1) $110^\\circ$　(2) $70^\\circ$", "solution": "(1) 円周角は中心角の半分だから，$220^\\circ \\div 2 = 110^\\circ$。\n(2) 反対側の弧の中心角は $360^\\circ - 220^\\circ = 140^\\circ$ で，その円周角は半分の $70^\\circ$。", "alt": "研究：(1)と(2)の和は180°になる。円に内接する四角形の対角の和が180°であることの表れ。", "rubric": [{"item": "円周角の定理（中心角の半分）を正しく使っている", "points": 3}, {"item": "反対側の弧についても中心角を正しく求めている", "points": 3}, {"item": "計算が正確で、途中の式変形に誤りがない", "points": 2}, {"item": "最後に答え（結論）を明確に書いている", "points": 2}], "tpl": "koko_circumference_angle", "date": "2026-12-08", "course": "koko"}, "2026-12-09": {"category": "二次方程式", "minutes": 7, "statement": "2次方程式 $x^{2} + 1x - 6 = 0$ を解け。", "hints": ["まず因数分解を試す（定数項の約数の組）。", "因数分解できたら「積＝0」から2つの一次方程式に分ける。", "解は元の式に代入して検算できる。"], "answer": "$x = -3, 2$", "solution": "左辺を因数分解すると $(x - 2)(x + 3) = 0$。\n積が $0$ だから，$x - 2 = 0$ または $x + 3 = 0$。よって $x = 2, -3$。", "alt": "別解：解の公式 $x = \\frac{-b \\pm \\sqrt{b^{2} - 4ac}}{2a}$ でも同じ解になる。因数分解が見つからないときの保険として使える。", "rubric": [{"item": "因数分解（または解の公式）で正しく変形している", "points": 3}, {"item": "2つの解を両方書いている", "points": 3}, {"item": "計算が正確で、途中の式変形に誤りがない", "points": 2}, {"item": "最後に答え（結論）を明確に書いている", "points": 2}], "tpl": "koko_quad_eq", "date": "2026-12-09", "course": "koko"}, "2026-12-10": {"category": "資料の活用", "minutes": 8, "statement": "$8$ 人の生徒の通学時間（分）を調べると，短い順に 3, 8, 12, 12, 19, 20, 21, 26 であった。\n(1) 中央値を求めよ。\n(2) $10$ 分以上 $20$ 分未満の人の相対度数を求めよ。", "hints": ["中央値は「順に並べたときの真ん中」。偶数個なら真ん中2つの平均。", "相対度数は「その階級の人数 ÷ 全体の人数」。", "「以上・未満」の区切りで，端の値がどちらに入るかに注意。"], "answer": "(1) $\\frac{31}{2}$ 分　(2) $\\frac{3}{8}$", "solution": "(1) データは $8$ 個で偶数だから，中央値は真ん中2つ（$4$ 番目の $12$ と $5$ 番目の $19$）の平均で $\\frac{12 + 19}2 = \\frac{31}{2}$ 分。\n(2) $10$ 以上 $20$ 未満は $3$ 人。相対度数は $\\frac{3}{8} = \\frac{3}{8}$。", "alt": "研究：相対度数は全体の人数が違う集団同士を比べるための工夫。割合の考え方の応用。", "rubric": [{"item": "中央値を，個数の偶数・奇数に応じて正しく求めている", "points": 3}, {"item": "相対度数を正しく計算している", "points": 3}, {"item": "計算が正確で、途中の式変形に誤りがない", "points": 2}, {"item": "最後に答え（結論）を明確に書いている", "points": 2}], "tpl": "koko_data_median", "date": "2026-12-10", "course": "koko"}, "2026-12-11": {"category": "規則性", "minutes": 8, "statement": "正方形のタイルを並べて図形を作る。$1$ 番目の図形にはタイルが $4$ 枚，$2$ 番目には $6$ 枚，$3$ 番目には $8$ 枚使われている。\n(1) $n$ 番目の図形のタイルの枚数を，$n$ の式で表せ。\n(2) $14$ 番目の図形のタイルの枚数を求めよ。", "hints": ["増え方に注目する。1つ進むごとに何枚増えるか。", "「$n$ 番目＝最初＋増加×$(n-1)$」。$n$ ではなく $n-1$ 回増えるのがポイント。", "$n = 1, 2$ を代入して，式が合うか確かめよう。"], "answer": "(1) $2n + 2$ 枚　(2) $30$ 枚", "solution": "枚数は $4$ の場合」。", "(2)は元に戻さないので，2回目は全体も当たりも1つ減る。", "2回続けて起こる確率は，それぞれの確率の積。"], "answer": "(1) $\\frac{1}{4}$　(2) $\\frac{1}{28}$", "solution": "(1) 全体 $8$ 本のうち当たり $2$ 本だから，$\\frac{2}{8} = \\frac{1}{4}$。\n(2) 1回目のあと全体は $7$ 本，当たりは $1$ 本になる。積の法則で $\\frac{2}{8} \\times \\frac{1}{7} = \\frac{1}{28}$。", "alt": "研究：元に戻す場合は2回目も同じ確率になる。「戻す・戻さない」の読み取りが確率の文章題の最大の分かれ目。", "rubric": [{"item": "全体と当たりの数を正しく数えている", "points": 3}, {"item": "元に戻さない場合の数の変化を扱い，積の法則を使っている", "points": 3}, {"item": "計算が正確で、途中の式変形に誤りがない", "points": 2}, {"item": "最後に答え（結論）を明確に書いている", "points": 2}], "tpl": "koko_lottery_prob", "date": "2026-12-14", "course": "koko"}, "2026-12-15": {"category": "関数と図形", "minutes": 10, "statement": "座標平面上に3点 $O(0, 0)$，$A(5, 0)$，$B(5, 6)$ がある。\n(1) 三角形 $OAB$ の面積を求めよ。\n(2) 点 $B$ を通り，三角形 $OAB$ の面積を2等分する直線と $x$ 軸との交点の座標を求めよ。", "hints": ["まず3点の位置を図に描く。直角三角形になっていることに気づく。", "面積の2等分のキーワードは「中点」。頂点と対辺の中点を結ぶ。", "中点の座標は，両端の平均。"], "answer": "(1) $15$　(2) $(\\frac{5}{2}, 0)$", "solution": "(1) $OA = 5$，$AB = 6$ の直角三角形だから，面積は $5 \\times 6 \\div 2 = 15$。\n(2) 三角形の面積の2等分は，頂点から対辺の中点に引いた線（中線）でできる。辺 $OA$ の中点は $(\\frac{5}{2}, 0)$ だから，求める交点は $(\\frac{5}{2}, 0)$。", "alt": "研究：中線は三角形を面積の等しい2つに分ける。これは中線定理や重心（中線を2:1に分ける点）の学習につながる。", "rubric": [{"item": "三角形の形を正しく捉えて面積を計算している", "points": 3}, {"item": "中線による面積二等分の考え方を使っている", "points": 3}, {"item": "計算が正確で、途中の式変形に誤りがない", "points": 2}, {"item": "最後に答え（結論）を明確に書いている", "points": 2}], "tpl": "koko_area_bisect", "date": "2026-12-15", "course": "koko"}, "2026-12-16": {"category": "三平方の定理", "minutes": 8, "statement": "座標平面上の2点 $A(1, 2)$，$B(3, 9)$ の間の距離を求めよ。", "hints": ["2点間の距離は，座標の差を2辺とする直角三角形の斜辺。", "$x$ の差と $y$ の差をそれぞれ数える（引き算の符号に注意）。", "最後に根号を簡単にできるか確認する。"], "answer": "$\\sqrt{53}$", "solution": "2点の $x$ 座標の差は $2$，$y$ 座標の差は $7$。この差を2辺とする直角三角形を考えると，斜辺が求める距離になる。\n三平方の定理より，距離は $\\sqrt{2^{2} + 7^{2}} = \\sqrt{53} = \\sqrt{53}$。", "alt": "研究：この計算は高校の「2点間の距離の公式」$\\sqrt{(x_2-x_1)^{2} + (y_2-y_1)^{2}}$ の中身そのもの。", "rubric": [{"item": "座標の差から直角三角形を作っている", "points": 3}, {"item": "三平方の定理を使い，根号を簡単にしている", "points": 3}, {"item": "計算が正確で、途中の式変形に誤りがない", "points": 2}, {"item": "最後に答え（結論）を明確に書いている", "points": 2}], "tpl": "koko_pythagoras_dist", "date": "2026-12-16", "course": "koko"}, "2026-12-17": {"category": "一次関数", "minutes": 12, "statement": "2直線 $y = \\frac{1}{2}x + 1$ と $y = -x + 4$ について，次の問いに答えよ。\n(1) 交点の座標を求めよ。\n(2) 2直線と $x$ 軸で囲まれた三角形の面積を求めよ。", "hints": ["交点は連立方程式の解。2つの $y$ の式を等しいと置く。", "(2)の三角形の頂点は，交点と，2直線が $x$ 軸と交わる点。", "底辺は $x$ 軸上にとると，高さは交点の $y$ 座標（の絶対値）になる。"], "answer": "(1) $(2, 2)$　(2) $6$", "solution": "(1) 2式を連立する。$\\frac{1}{2}x + 1 = -x + 4$ を解くと $x = 2$，これを一方に代入して $y = 2$。交点は $(2, 2)$。\n(2) 各直線と $x$ 軸の交点は $(-2, 0)$ と $(4, 0)$。底辺の長さは $6$，高さは交点の $y$ 座標の絶対値 $2$。\n面積は $6 \\times 2 \\div 2 = 6$。", "alt": "研究：面積は「底辺×高さ÷2」。底辺を $x$ 軸上にとるのがコツで，座標平面の面積問題の多くはこの形に帰着する。", "rubric": [{"item": "連立方程式を解いて交点を求めている", "points": 3}, {"item": "底辺と高さを正しく読み取り，面積を計算している", "points": 3}, {"item": "計算が正確で、途中の式変形に誤りがない", "points": 2}, {"item": "最後に答え（結論）を明確に書いている", "points": 2}], "tpl": "koko_linear_intersect", "figure": {"type": "two_lines", "m1": 0.5, "b1": 1.0, "m2": -1.0, "b2": 4.0}, "date": "2026-12-17", "course": "koko"}, "2026-12-18": {"category": "連立方程式", "minutes": 10, "statement": "$1$ 個 $80$ 円の品物 $A$ と，$1$ 個 $90$ 円の品物 $B$ を，合わせて $11$ 個買うと，代金は全部で $940$ 円になった。\n$A, B$ をそれぞれ何個買ったか求めよ。", "hints": ["分からないものは2つ。$x, y$ と置いて，式も2つ立てる（個数の式と代金の式）。", "加減法か代入法で1文字消す。", "答えは問題の場面に合うか（個数が正の整数か）を確認する。"], "answer": "$A$ が $5$ 個，$B$ が $6$ 個", "solution": "$A$ を $x$ 個，$B$ を $y$ 個とすると，個数について $x + y = 11$，代金について $80x + 90y = 940$。\n1つ目の式を $\\times 90$ して引く（加減法）と $x = 5$ が分かり，$y = 6$。\n検算：$80 \\times 5 + 90 \\times 6 = 940$ 円で合う。", "alt": "研究：連立方程式の解は，2直線の交点の座標でもある。グラフで考えると「式を2つ立てる」意味が見える。", "rubric": [{"item": "個数と代金の2つの式を正しく立てている", "points": 3}, {"item": "加減法・代入法で正しく解いている", "points": 3}, {"item": "計算が正確で、途中の式変形に誤りがない", "points": 2}, {"item": "最後に答え（結論）を明確に書いている", "points": 2}], "tpl": "koko_renritsu_word", "date": "2026-12-18", "course": "koko"}, "2026-12-19": {"category": "二次関数", "minutes": 10, "statement": "関数 $y = \\frac{1}{2}x^{2}$ について，次の問いに答えよ。\n(1) $x$ の変域が $-3 \\le x \\le 1$ のとき，$y$ の変域を求めよ。\n(2) $x$ が $-3$ から $1$ まで増加するときの変化の割合を求めよ。", "hints": ["$y = ax^{2}$ は $x = 0$ で最小（$a>0$）。変域に0が入るかがポイント。", "端点の値と頂点（原点）の値を比べて変域を決める。", "変化の割合は「$y$ の増加量 ÷ $x$ の増加量」。一次関数と違って一定ではない。"], "answer": "(1) $0 \\le y \\le \\frac{9}{2}$　(2) $-1$", "solution": "(1) $x = 0$ が変域に含まれるので，$y$ の最小値は $x = 0$ のときの $0$。端点では $x = -3$ で $y = \\frac{9}{2}$，$x = 1$ で $y = \\frac{1}{2}$。よって変域は $0 \\le y \\le \\frac{9}{2}$。\n(2) 変化の割合は $\\frac{\\frac{1}{2} - \\frac{9}{2}}{1 - -3} = -1$。", "alt": "研究：変化の割合は $a(x_1 + x_2)$ と整理できる。2点の平均と関係する形で，後の「微分」につながる考え方。", "rubric": [{"item": "変域に $x=0$ が含まれることに気づき，最小値を正しく求めている", "points": 3}, {"item": "変化の割合を定義どおりに計算している", "points": 3}, {"item": "計算が正確で、途中の式変形に誤りがない", "points": 2}, {"item": "最後に答え（結論）を明確に書いている", "points": 2}], "tpl": "koko_parabola_range", "figure": {"type": "parabola", "a": 0.5, "b": 0, "c": 0, "lo": -4, "hi": 2}, "date": "2026-12-19", "course": "koko"}, "2026-12-20": {"category": "平面図形", "minutes": 8, "statement": "円 $O$ において，弧 $AB$ に対する中心角が $210^\\circ$ である。\n(1) 同じ弧 $AB$ に対する円周角の大きさを求めよ。\n(2) 弧 $AB$ の反対側（大きいほうの弧）に対する円周角の大きさを求めよ。", "hints": ["円周角＝中心角の半分（同じ弧に対して）。", "(2)は一周360°から引いて，反対側の弧の中心角を出す。", "円に内接する四角形の対角の和は180°，という見方でも(2)が求まる。"], "answer": "(1) $105^\\circ$　(2) $75^\\circ$", "solution": "(1) 円周角は中心角の半分だから，$210^\\circ \\div 2 = 105^\\circ$。\n(2) 反対側の弧の中心角は $360^\\circ - 210^\\circ = 150^\\circ$ で，その円周角は半分の $75^\\circ$。", "alt": "研究：(1)と(2)の和は180°になる。円に内接する四角形の対角の和が180°であることの表れ。", "rubric": [{"item": "円周角の定理（中心角の半分）を正しく使っている", "points": 3}, {"item": "反対側の弧についても中心角を正しく求めている", "points": 3}, {"item": "計算が正確で、途中の式変形に誤りがない", "points": 2}, {"item": "最後に答え（結論）を明確に書いている", "points": 2}], "tpl": "koko_circumference_angle", "date": "2026-12-20", "course": "koko"}, "2026-12-21": {"category": "二次方程式", "minutes": 7, "statement": "2次方程式 $x^{2} + 9x + 18 = 0$ を解け。", "hints": ["まず因数分解を試す（定数項の約数の組）。", "因数分解できたら「積＝0」から2つの一次方程式に分ける。", "解は元の式に代入して検算できる。"], "answer": "$x = -6, -3$", "solution": "左辺を因数分解すると $(x + 3)(x + 6) = 0$。\n積が $0$ だから，$x + 3 = 0$ または $x + 6 = 0$。よって $x = -3, -6$。", "alt": "別解：解の公式 $x = \\frac{-b \\pm \\sqrt{b^{2} - 4ac}}{2a}$ でも同じ解になる。因数分解が見つからないときの保険として使える。", "rubric": [{"item": "因数分解（または解の公式）で正しく変形している", "points": 3}, {"item": "2つの解を両方書いている", "points": 3}, {"item": "計算が正確で、途中の式変形に誤りがない", "points": 2}, {"item": "最後に答え（結論）を明確に書いている", "points": 2}], "tpl": "koko_quad_eq", "date": "2026-12-21", "course": "koko"}, "2026-12-22": {"category": "資料の活用", "minutes": 8, "statement": "$10$ 人の生徒の通学時間（分）を調べると，短い順に 5, 13, 15, 18, 21, 22, 22, 24, 25, 30 であった。\n(1) 中央値を求めよ。\n(2) $10$ 分以上 $20$ 分未満の人の相対度数を求めよ。", "hints": ["中央値は「順に並べたときの真ん中」。偶数個なら真ん中2つの平均。", "相対度数は「その階級の人数 ÷ 全体の人数」。", "「以上・未満」の区切りで，端の値がどちらに入るかに注意。"], "answer": "(1) $\\frac{43}{2}$ 分　(2) $\\frac{3}{10}$", "solution": "(1) データは $10$ 個で偶数だから，中央値は真ん中2つ（$5$ 番目の $21$ と $6$ 番目の $22$）の平均で $\\frac{21 + 22}2 = \\frac{43}{2}$ 分。\n(2) $10$ 以上 $20$ 未満は $3$ 人。相対度数は $\\frac{3}{10} = \\frac{3}{10}$。", "alt": "研究：相対度数は全体の人数が違う集団同士を比べるための工夫。割合の考え方の応用。", "rubric": [{"item": "中央値を，個数の偶数・奇数に応じて正しく求めている", "points": 3}, {"item": "相対度数を正しく計算している", "points": 3}, {"item": "計算が正確で、途中の式変形に誤りがない", "points": 2}, {"item": "最後に答え（結論）を明確に書いている", "points": 2}], "tpl": "koko_data_median", "date": "2026-12-22", "course": "koko"}, "2026-12-23": {"category": "規則性", "minutes": 8, "statement": "正方形のタイルを並べて図形を作る。$1$ 番目の図形にはタイルが $3$ 枚，$2$ 番目には $8$ 枚，$3$ 番目には $13$ 枚使われている。\n(1) $n$ 番目の図形のタイルの枚数を，$n$ の式で表せ。\n(2) $9$ 番目の図形のタイルの枚数を求めよ。", "hints": ["増え方に注目する。1つ進むごとに何枚増えるか。", "「$n$ 番目＝最初＋増加×$(n-1)$」。$n$ ではなく $n-1$ 回増えるのがポイント。", "$n = 1, 2$ を代入して，式が合うか確かめよう。"], "answer": "(1) $5n - 2$ 枚　(2) $43$ 枚", "solution": "枚数は $3$ から $5$ ずつ増える。$n$ 番目は「最初の $3$ 枚に，$5$ 枚の増加が $(n-1)$ 回」で，$3 + 5(n - 1) = 5n + -2$ 枚。\n(2) $n = 9$ を代入して $43$ 枚。", "alt": "研究：この考え方は高校の等差数列 $a_n = a_1 + (n-1)d$ そのもの。中学の規則性は数列の入口になっている。", "rubric": [{"item": "増え方（1つ進むごとの増加量）を正しく読み取っている", "points": 3}, {"item": "$n$ 番目の式を $(n-1)$ 回の増加として立てている", "points": 3}, {"item": "計算が正確で、途中の式変形に誤りがない", "points": 2}, {"item": "最後に答え（結論）を明確に書いている", "points": 2}], "tpl": "koko_pattern_tiles", "date": "2026-12-23", "course": "koko"}, "2026-12-24": {"category": "平方根", "minutes": 7, "statement": "次の計算をせよ。$\\sqrt{75} - \\sqrt{12}$", "hints": ["まず根号の中を簡単に（素因数分解して，2つ出た因数を外に出す）。", "同じ根号になれば，係数同士で計算できる。", "違う根号はそれ以上まとめられない。"], "answer": "$3\\sqrt{3}$", "solution": "根号の中を簡単にすると，$\\sqrt{75} = 5\\sqrt{3}$，$\\sqrt{12} = 2\\sqrt{3}$。\n同じ根号の項は文字のようにまとめることができて，$(5 - 2)\\sqrt{3} = $3\\sqrt{3}$$。", "alt": "研究：$\\sqrt{a}$ の簡約は素因数分解が土台。$\\sqrt{12} = 2\\sqrt{3}$ のような変形は，分母の有理化でも使う。", "rubric": [{"item": "根号の中を正しく簡単にしている", "points": 3}, {"item": "同じ根号の項を係数でまとめている", "points": 3}, {"item": "計算が正確で、途中の式変形に誤りがない", "points": 2}, {"item": "最後に答え（結論）を明確に書いている", "points": 2}], "tpl": "koko_sqrt_calc", "date": "2026-12-24", "course": "koko"}, "2026-12-25": {"category": "式の計算", "minutes": 6, "statement": "次の式を因数分解せよ。$x^{2} + 7x + 6$", "hints": ["定数項の約数の組を挙げて，和が $x$ の係数になる組を探す。", "符号の組み合わせに注意。積が正で和が負なら，2つとも負の数。", "答えは展開して検算できる。因数分解は必ず検算しよう。"], "answer": "$(x + 1)(x + 6)$", "solution": "定数項 $6$ の約数の組で，和が $7$ になるのは $-1$ と $-6$（符号に注意）。\nよって $(x + 1)(x + 6)$。展開して元の式に戻ることを確かめよう。", "alt": "研究：因数分解は二次方程式を解く道具にもなる。$(x - r_1)(x - r_2) = 0$ の解は $x = r_1, r_2$。", "rubric": [{"item": "定数項の約数から，積と和の合う組を見つけている", "points": 3}, {"item": "符号の処理が正しい", "points": 3}, {"item": "計算が正確で、途中の式変形に誤りがない", "points": 2}, {"item": "最後に答え（結論）を明確に書いている", "points": 2}], "tpl": "koko_factorize", "date": "2026-12-25", "course": "koko"}, "2026-12-26": {"category": "関数と図形", "minutes": 10, "statement": "座標平面上に3点 $O(0, 0)$，$A(3, 0)$，$B(3, 4)$ がある。\n(1) 三角形 $OAB$ の面積を求めよ。\n(2) 点 $B$ を通り，三角形 $OAB$ の面積を2等分する直線と $x$ 軸との交点の座標を求めよ。", "hints": ["まず3点の位置を図に描く。直角三角形になっていることに気づく。", "面積の2等分のキーワードは「中点」。頂点と対辺の中点を結ぶ。", "中点の座標は，両端の平均。"], "answer": "(1) $6$　(2) $(\\frac{3}{2}, 0)$", "solution": "(1) $OA = 3$，$AB = 4$ の直角三角形だから，面積は $3 \\times 4 \\div 2 = 6$。\n(2) 三角形の面積の2等分は，頂点から対辺の中点に引いた線（中線）でできる。辺 $OA$ の中点は $(\\frac{3}{2}, 0)$ だから，求める交点は $(\\frac{3}{2}, 0)$。", "alt": "研究：中線は三角形を面積の等しい2つに分ける。これは中線定理や重心（中線を2:1に分ける点）の学習につながる。", "rubric": [{"item": "三角形の形を正しく捉えて面積を計算している", "points": 3}, {"item": "中線による面積二等分の考え方を使っている", "points": 3}, {"item": "計算が正確で、途中の式変形に誤りがない", "points": 2}, {"item": "最後に答え（結論）を明確に書いている", "points": 2}], "tpl": "koko_area_bisect", "date": "2026-12-26", "course": "koko"}, "2026-12-27": {"category": "三平方の定理", "minutes": 8, "statement": "座標平面上の2点 $A(1, 2)$，$B(6, 11)$ の間の距離を求めよ。", "hints": ["2点間の距離は，座標の差を2辺とする直角三角形の斜辺。", "$x$ の差と $y$ の差をそれぞれ数える（引き算の符号に注意）。", "最後に根号を簡単にできるか確認する。"], "answer": "$\\sqrt{106}$", "solution": "2点の $x$ 座標の差は $5$，$y$ 座標の差は $9$。この差を2辺とする直角三角形を考えると，斜辺が求める距離になる。\n三平方の定理より，距離は $\\sqrt{5^{2} + 9^{2}} = \\sqrt{106} = \\sqrt{106}$。", "alt": "研究：この計算は高校の「2点間の距離の公式」$\\sqrt{(x_2-x_1)^{2} + (y_2-y_1)^{2}}$ の中身そのもの。", "rubric": [{"item": "座標の差から直角三角形を作っている", "points": 3}, {"item": "三平方の定理を使い，根号を簡単にしている", "points": 3}, {"item": "計算が正確で、途中の式変形に誤りがない", "points": 2}, {"item": "最後に答え（結論）を明確に書いている", "points": 2}], "tpl": "koko_pythagoras_dist", "date": "2026-12-27", "course": "koko"}, "2026-12-28": {"category": "一次関数", "minutes": 12, "statement": "2直線 $y = 2x - 1$ と $y = -x + 2$ について，次の問いに答えよ。\n(1) 交点の座標を求めよ。\n(2) 2直線と $x$ 軸で囲まれた三角形の面積を求めよ。", "hints": ["交点は連立方程式の解。2つの $y$ の式を等しいと置く。", "(2)の三角形の頂点は，交点と，2直線が $x$ 軸と交わる点。", "底辺は $x$ 軸上にとると，高さは交点の $y$ 座標（の絶対値）になる。"], "answer": "(1) $(1, 1)$　(2) $\\frac{3}{4}$", "solution": "(1) 2式を連立する。$2x - 1 = -x + 2$ を解くと $x = 1$，これを一方に代入して $y = 1$。交点は $(1, 1)$。\n(2) 各直線と $x$ 軸の交点は $(\\frac{1}{2}, 0)$ と $(2, 0)$。底辺の長さは $\\frac{3}{2}$，高さは交点の $y$ 座標の絶対値 $1$。\n面積は $\\frac{3}{2} \\times 1 \\div 2 = \\frac{3}{4}$。", "alt": "研究：面積は「底辺×高さ÷2」。底辺を $x$ 軸上にとるのがコツで，座標平面の面積問題の多くはこの形に帰着する。", "rubric": [{"item": "連立方程式を解いて交点を求めている", "points": 3}, {"item": "底辺と高さを正しく読み取り，面積を計算している", "points": 3}, {"item": "計算が正確で、途中の式変形に誤りがない", "points": 2}, {"item": "最後に答え（結論）を明確に書いている", "points": 2}], "tpl": "koko_linear_intersect", "figure": {"type": "two_lines", "m1": 2.0, "b1": -1.0, "m2": -1.0, "b2": 2.0}, "date": "2026-12-28", "course": "koko"}, "2026-12-29": {"category": "連立方程式", "minutes": 10, "statement": "$1$ 個 $120$ 円の品物 $A$ と，$1$ 個 $90$ 円の品物 $B$ を，合わせて $16$ 個買うと，代金は全部で $1650$ 円になった。\n$A, B$ をそれぞれ何個買ったか求めよ。", "hints": ["分からないものは2つ。$x, y$ と置いて，式も2つ立てる（個数の式と代金の式）。", "加減法か代入法で1文字消す。", "答えは問題の場面に合うか（個数が正の整数か）を確認する。"], "answer": "$A$ が $7$ 個，$B$ が $9$ 個", "solution": "$A$ を $x$ 個，$B$ を $y$ 個とすると，個数について $x + y = 16$，代金について $120x + 90y = 1650$。\n1つ目の式を $\\times 90$ して引く（加減法）と $x = 7$ が分かり，$y = 9$。\n検算：$120 \\times 7 + 90 \\times 9 = 1650$ 円で合う。", "alt": "研究：連立方程式の解は，2直線の交点の座標でもある。グラフで考えると「式を2つ立てる」意味が見える。", "rubric": [{"item": "個数と代金の2つの式を正しく立てている", "points": 3}, {"item": "加減法・代入法で正しく解いている", "points": 3}, {"item": "計算が正確で、途中の式変形に誤りがない", "points": 2}, {"item": "最後に答え（結論）を明確に書いている", "points": 2}], "tpl": "koko_renritsu_word", "date": "2026-12-29", "course": "koko"}, "2026-12-30": {"category": "二次関数", "minutes": 10, "statement": "関数 $y = 1x^{2}$ について，次の問いに答えよ。\n(1) $x$ の変域が $-2 \\le x \\le 2$ のとき，$y$ の変域を求めよ。\n(2) $x$ が $-2$ から $2$ まで増加するときの変化の割合を求めよ。", "hints": ["$y = ax^{2}$ は $x = 0$ で最小（$a>0$）。変域に0が入るかがポイント。", "端点の値と頂点（原点）の値を比べて変域を決める。", "変化の割合は「$y$ の増加量 ÷ $x$ の増加量」。一次関数と違って一定ではない。"], "answer": "(1) $0 \\le y \\le 4$　(2) $0$", "solution": "(1) $x = 0$ が変域に含まれるので，$y$ の最小値は $x = 0$ のときの $0$。端点では $x = -2$ で $y = 4$，$x = 2$ で $y = 4$。よって変域は $0 \\le y \\le 4$。\n(2) 変化の割合は $\\frac{4 - 4}{2 - -2} = 0$。", "alt": "研究：変化の割合は $a(x_1 + x_2)$ と整理できる。2点の平均と関係する形で，後の「微分」につながる考え方。", "rubric": [{"item": "変域に $x=0$ が含まれることに気づき，最小値を正しく求めている", "points": 3}, {"item": "変化の割合を定義どおりに計算している", "points": 3}, {"item": "計算が正確で、途中の式変形に誤りがない", "points": 2}, {"item": "最後に答え（結論）を明確に書いている", "points": 2}], "tpl": "koko_parabola_range", "figure": {"type": "parabola", "a": 1.0, "b": 0, "c": 0, "lo": -3, "hi": 3}, "date": "2026-12-30", "course": "koko"}, "2026-12-31": {"category": "平面図形", "minutes": 8, "statement": "円 $O$ において，弧 $AB$ に対する中心角が $160^\\circ$ である。\n(1) 同じ弧 $AB$ に対する円周角の大きさを求めよ。\n(2) 弧 $AB$ の反対側（大きいほうの弧）に対する円周角の大きさを求めよ。", "hints": ["円周角＝中心角の半分（同じ弧に対して）。", "(2)は一周360°から引いて，反対側の弧の中心角を出す。", "円に内接する四角形の対角の和は180°，という見方でも(2)が求まる。"], "answer": "(1) $80^\\circ$　(2) $100^\\circ$", "solution": "(1) 円周角は中心角の半分だから，$160^\\circ \\div 2 = 80^\\circ$。\n(2) 反対側の弧の中心角は $360^\\circ - 160^\\circ = 200^\\circ$ で，その円周角は半分の $100^\\circ$。", "alt": "研究：(1)と(2)の和は180°になる。円に内接する四角形の対角の和が180°であることの表れ。", "rubric": [{"item": "円周角の定理（中心角の半分）を正しく使っている", "points": 3}, {"item": "反対側の弧についても中心角を正しく求めている", "points": 3}, {"item": "計算が正確で、途中の式変形に誤りがない", "points": 2}, {"item": "最後に答え（結論）を明確に書いている", "points": 2}], "tpl": "koko_circumference_angle", "date": "2026-12-31", "course": "koko"}}, "rigaku": {"2026-12-01": {"category": "整数の性質", "minutes": 12, "statement": "方程式 $3x + 4y = 23$ を満たす正の整数の組 $(x, y)$ をすべて求めよ。また，組の個数も答えよ。", "hints": ["まず解を1つ見つける（係数の倍数を試すと見つかる）。", "一般解は「特殊解＋周期」の形。$a$ と $b$ が互いに素なら，$x$ は $b$ ずつ，$y$ は $a$ ずつ動く。", "正の整数という条件で $k$ の範囲を絞る。端の確かめを忘れずに。"], "answer": "$(1, 5), (5, 2)$ の $2$ 組", "solution": "まず特殊解を1つ見つける。$x = 5, y = 2$ が解になる（$3 \\times 5 + 4 \\times 2 = 23$）。\n$3(x - 5) + 4(y - 2) = 0$ と変形でき，$3$ と $4$ は互いに素だから，$x - 5 = 4k$，$y - 2 = -3k$（$k$ は整数）と表せる。\n$x > 0, y > 0$ の範囲で $k$ を動かすと，組は $(1, 5, 5, 2)$ の $2$ 組。", "alt": "別解：合同式を使う方法もある。$3x \\equiv 23 \\pmod{4}$ を解いて $x$ の候補を絞るやり方で，係数が大きいときに速い。", "rubric": [{"item": "特殊解を1つ見つけ，一般解の形を導いている", "points": 3}, {"item": "正の整数の範囲で $k$ を絞り，組を漏れなく挙げている", "points": 3}, {"item": "計算が正確で、途中の式変形に誤りがない", "points": 2}, {"item": "最後に答え（結論）を明確に書いている", "points": 2}], "tpl": "rigaku_diophantine", "date": "2026-12-01", "course": "rigaku"}, "2026-12-02": {"category": "数列", "minutes": 12, "statement": "数列 $a_n = (2 + 2(n-1)) \\cdot \\frac{1}{2}^{n-1}$ の初項から第 $6$ 項までの和 $S_{6}$ を求めよ。", "hints": ["等差数列×等比数列の和は，$S$ と $rS$ の差をとるのが定石。", "差をとると真ん中の項が等比数列の和になり，両端に2項だけ残る。", "最後は $(1-r)$ で割る。$r$ が分数のときは計算ミスに注意。"], "answer": "$S_{6} = \\frac{15}{2}$", "solution": "$S = S_{6}$ と $rS$（$r = \\frac{1}{2}$）の差をとると，等比数列の和に帰着する「等差×等比」の常套手段が使える。\n項を書き出すと $S_{6} = 2 + 2 + \\frac{3}{2} + 1 + \\frac{5}{8} + \\frac{3}{8}$。\n差をとって整理すると $S_{6} = \\frac{15}{2}$ となる。", "alt": "研究：この手法は $\\sum n r^{n}$ 型の無限級数（$|r|<1$ で収束）の計算にもそのまま使える。確率の期待値の計算（幾何分布）にも現れる考え方。", "rubric": [{"item": "$S$ と $rS$ の差をとる方法で等比数列の和に帰着している", "points": 3}, {"item": "両端に残る項の処理が正しい", "points": 3}, {"item": "計算が正確で、途中の式変形に誤りがない", "points": 2}, {"item": "最後に答え（結論）を明確に書いている", "points": 2}], "tpl": "rigaku_mixed_series", "date": "2026-12-02", "course": "rigaku"}, "2026-12-03": {"category": "二次関数", "minutes": 12, "statement": "$f(x) = x^{2} - 5x + 2$（$1 \\le x \\le 4$）の最大値と最小値，およびそのときの $x$ の値を求めよ。", "hints": ["まず平方完成して軸の位置を求めよう。軸が区間の中にあるかどうかが分かれ目だ。", "最大・最小の候補は「頂点」と「区間の両端」の3点だけ。この3点を比べればよい。", "頂点の値 $f(\\frac{5}{2})$ と両端の値を計算して，大きい順に並べてみよう。"], "answer": "最大値 $-2$（$x=1$ のとき），最小値 $-\\frac{17}{4}$（$x=\\frac{5}{2}$ のとき）", "solution": "$f(x)$ を平方完成すると $f(x) = (x - \\frac{5}{2})^{2} - \\frac{17}{4}$ となり，軸は $x = \\frac{5}{2}$ で区間内にある。\n端点の値は $f(1) = -2$，$f(4) = -2$，頂点の値は $f(\\frac{5}{2}) = -\\frac{17}{4}$。\nこれらを比べて，最大値 $-2$（$x=1$），最小値 $-\\frac{17}{4}$（$x=\\frac{5}{2}$）。", "alt": "研究：軸が区間の外にあると，最大・最小はどちらも端点でとる。軸と区間の位置関係で場合分けするのが，文字係数の問題（例：$f(x)=x^{2}-2ax+3$）でも同じ考え方になる。", "rubric": [{"item": "平方完成をして軸の位置を正しく求めている", "points": 3}, {"item": "頂点と両端の3点をすべて比較している", "points": 3}, {"item": "計算が正確で、途中の式変形に誤りがない", "points": 2}, {"item": "最後に答え（結論）を明確に書いている", "points": 2}], "tpl": "rigaku_quad_interval", "figure": {"type": "parabola", "a": 1.0, "b": -5.0, "c": 2.0, "lo": 1, "hi": 4}, "date": "2026-12-03", "course": "rigaku"}, "2026-12-04": {"category": "場合の数", "minutes": 10, "statement": "男子 $4$ 人と女子 $5$ 人の中から $3$ 人の委員を選ぶ。女子が $1$ 人以上入る選び方は何通りあるか。", "hints": ["「〜人以上」は，人数ごとに場合分けして足すのが基本。", "女子の人数を決めれば，男子の人数も自動的に決まる。", "余事象（女子が少ない場合を全体から引く）でも計算できる。人数が少ないほうを選ぶと速い。"], "answer": "$80$ 通り", "solution": "場合分けして数える。\n女子 $1$ 人・男子 $2$ 人の場合が ${}_{5}C_{1} \\times {}_{4}C_{2} = 30$ 通り，女子 $2$ 人・男子 $1$ 人の場合が ${}_{5}C_{2} \\times {}_{4}C_{1} = 40$ 通り，女子 $3$ 人・男子 $0$ 人の場合が ${}_{5}C_{3} \\times {}_{4}C_{0} = 10$ 通り。\n合計して $80$ 通り。", "alt": "別解：全体 ${}_{9}C_{3} = 84$ 通りから，女子が 0 人以下の場合を引く余事象の計算でも同じ答えになる。どちらの場合分けが少ないかを見てから解き始めるのが実戦的。", "rubric": [{"item": "女子の人数で場合分けし，各場合を積の法則で数えている", "points": 3}, {"item": "場合の漏れ・重なりがないことを確認している", "points": 3}, {"item": "計算が正確で、途中の式変形に誤りがない", "points": 2}, {"item": "最後に答え（結論）を明確に書いている", "points": 2}], "tpl": "rigaku_committee", "date": "2026-12-04", "course": "rigaku"}, "2026-12-05": {"category": "確率", "minutes": 12, "statement": "赤玉 $3$ 個と白玉 $3$ 個が入った袋から，玉を1個ずつ2回，元に戻さずに取り出す。\n(1) 1回目が白，2回目が赤である確率を求めよ。\n(2) 1回目が白であったとき，2回目が赤である条件付き確率を求めよ。", "hints": ["元に戻さない取り出しでは，2回目は全体の個数が1つ減ることに注意。", "(1)は積の法則。(2)は「条件のもとでの世界」に移って考える。", "(2)は定義どおり $\\frac{P(白→赤)}{P(白)}$ で計算しても同じになる。"], "answer": "(1) $\\frac{3}{10}$　(2) $\\frac{3}{5}$", "solution": "(1) 1回目が白の確率は $\\frac{3}{6}$，そのあと2回目が赤の確率は $\\frac{3}{5}$。積の法則より $\\frac{3}{6} \\times \\frac{3}{5} = \\frac{3}{10}$。\n(2) 条件付き確率は「1回目が白」という条件のもとでの確率。白を1個取り除いた残り $5$ 個から赤を引く確率で，$\\frac{3}{5} = \\frac{3}{5}$。", "alt": "研究：条件付き確率はベイズの定理の土台。(2)のように「条件が付くと分母の世界が変わる」という見方が，検査の陽性的中率などの応用で効いてくる。", "rubric": [{"item": "元に戻さない場合の個数の変化を正しく扱っている", "points": 3}, {"item": "条件付き確率を，条件のもとでの確率として計算している", "points": 3}, {"item": "計算が正確で、途中の式変形に誤りがない", "points": 2}, {"item": "最後に答え（結論）を明確に書いている", "points": 2}], "tpl": "rigaku_conditional_prob", "date": "2026-12-05", "course": "rigaku"}, "2026-12-06": {"category": "微分・積分", "minutes": 15, "statement": "放物線 $y = x^{2}$ 上の点 $(0, 0)$ における接線を $l$ とする。\n(1) 接線 $l$ の方程式を求めよ。\n(2) 接線 $l$ と放物線，および直線 $x = 3$ で囲まれた部分の面積を求めよ。", "hints": ["接線は「微分係数＝傾き」から作る。接点の座標も忘れずに。", "(2)では曲線と接線の差をとると $(x-t)^{2}$ の形に因数分解できるはず。接する＝差が重解をもつ，という関係を使う。", "面積は「上の式 − 下の式」の積分。区間内で差の符号が変わらないことを確認してから積分しよう。"], "answer": "(1) $y = 0$　(2) $9$", "solution": "(1) $y' = 2x$ より，接線の傾きは $2 \\cdot 0 = 0$。よって $l: y = 0(x - 0) + 0$，整理して $y = 0$。\n(2) 放物線と接線の差は $x^{2} - (0) = (x - 0)^{2}$ と因数分解できる（接するので重解をもつ）。\n面積は $\\int_{0}^{3} (x - 0)^{2} dx = \\left[ \\frac{1}{3}(x - 0)^{3} \\right]_{0}^{3} = \\frac{(3)^{3}}{3} = 9$。", "alt": "研究：放物線とその接線の間の面積には $\\frac{(\\beta - \\alpha)^{3}}{3}$ 型の公式がある。一般に2次関数と直線で囲まれた面積は $\\frac{|a|}{6}(\\beta-\\alpha)^{3}$（いわゆる1/6公式）で計算でき，検算に使える。", "rubric": [{"item": "接線の方程式を微分係数から正しく求めている", "points": 3}, {"item": "差が $(x-t)^{2}$ と因数分解できることを使って積分している", "points": 3}, {"item": "計算が正確で、途中の式変形に誤りがない", "points": 2}, {"item": "最後に答え（結論）を明確に書いている", "points": 2}], "tpl": "rigaku_tangent_area", "figure": {"type": "parabola", "a": 1, "b": 0, "c": 0, "lo": -1, "hi": 4}, "date": "2026-12-06", "course": "rigaku"}, "2026-12-07": {"category": "三角関数", "minutes": 12, "statement": "$0 \\le x \\le \\pi$ のとき，$y = 21\\sin x + 20\\cos x$ の最大値と，そのときの $\\sin x, \\cos x$ の値を求めよ。", "hints": ["$a\\sin x + b\\cos x$ は1つの $\\sin$ に合成できる。合成後の係数が最大値になる。", "$\\sqrt{21^{2} + 20^{2}} = 29$ をくくり出す形で合成してみよう。", "最大になるのは合成した角が $\\frac{\\pi}{2}$ のとき。その $x$ に対する $\\sin x, \\cos x$ は $\\alpha$ で表せる。"], "answer": "最大値 $29$，そのとき $\\sin x = \\frac{21}{29}$，$\\cos x = \\frac{20}{29}$", "solution": "合成すると $y = 29\\sin(x + \\alpha)$（ただし $\\cos\\alpha = \\frac{21}{29}$，$\\sin\\alpha = \\frac{20}{29}$）。\n$0 \\le x \\le \\pi$ では $x + \\alpha$ が $\\frac{\\pi}{2}$ をとれるので，最大値は $29$。\nこのとき $\\sin x = \\cos\\alpha = \\frac{21}{29}$，$\\cos x = \\sin\\alpha = \\frac{20}{29}$。", "alt": "別解：コーシー・シュワルツの不等式 $(p\\sin x + q\\cos x)^{2} \\le (p^{2}+q^{2})(\\sin^{2}x+\\cos^{2}x)$ からも最大値が得られる。等号成立条件が $\\sin x : \\cos x = p : q$ であることも確認しよう。", "rubric": [{"item": "三角関数の合成を正しく行っている", "points": 3}, {"item": "最大値をとる $x$ の存在を区間内で確認している", "points": 3}, {"item": "計算が正確で、途中の式変形に誤りがない", "points": 2}, {"item": "最後に答え（結論）を明確に書いている", "points": 2}], "tpl": "rigaku_trig_synth", "date": "2026-12-07", "course": "rigaku"}, "2026-12-08": {"category": "極限", "minutes": 10, "statement": "極限 $\\lim_{x \\to 30} \\frac{\\sqrt{x + 6} - 6}{x - 30}$ を求めよ。", "hints": ["$\\frac{0}{0}$ の形はそのままでは決まらない。因数分解か有理化で「消える因子」を作る。", "根号は共役な式を掛けるのが定石。分子が $x - r$ の形になるはず。", "約分したあとに代入する。約分前の式に代入してはいけない。"], "answer": "$\\frac{1}{12}$", "solution": "分母が $0$ になるので，分子の根号を有理化する。\n$\\frac{(\\sqrt{x + 6} - 6)(\\sqrt{x + 6} + 6)}{(x - 30)(\\sqrt{x + 6} + 6)} = \\frac{x - 30}{(x - 30)(\\sqrt{x + 6} + 6)}$。\n$x \\ne 30$ では約分できて $\\frac{1}{\\sqrt{x + 6} + 6}$ となり，$x \\to 30$ で $\\frac{1}{12}$。", "alt": "研究：この極限は関数 $\\sqrt{x + 6}$ の $x = 30$ における微分係数そのもの。定義に戻る計算と，微分公式の結果が一致することを確かめよう。", "rubric": [{"item": "有理化（共役な式を掛ける）で不定形を解消している", "points": 3}, {"item": "約分してから極限をとっている", "points": 3}, {"item": "計算が正確で、途中の式変形に誤りがない", "points": 2}, {"item": "最後に答え（結論）を明確に書いている", "points": 2}], "tpl": "rigaku_limit_sqrt", "date": "2026-12-08", "course": "rigaku"}, "2026-12-09": {"category": "積分", "minutes": 12, "statement": "放物線 $y = x^{2}$ と $y = -x^{2} + 8x$ で囲まれた部分の面積を求めよ。", "hints": ["まず交点の $x$ 座標を求める。囲まれた部分は交点の間だけにできる。", "「上の式 − 下の式」を積分する。どっちが上かは区間内の1点で試すと分かる。", "差を因数分解すると $-2(x-r_1)(x-r_2)$ の形になる。1/6公式が使える形だ。"], "answer": "$\\frac{64}{3}$", "solution": "2つの放物線の交点は $x^{2} = -x^{2} + 8x$，すなわち $2x^{2} - 8x + 0 = 0$ を解いて $x = 0, 4$。\n区間 $0 \\le x \\le 4$ では $y = -x^{2} + 8x$ が上にある。差は $-2(x - 0)(x - 4)$ と因数分解できる。\n面積は $\\int_{0}^{4} \\{ -2(x - 0)(x - 4) \\} dx = \\frac{64}{3}$（1/6公式でも同じ値になる）。", "alt": "別解：1/6公式 $\\frac{|a|}{6}(\\beta - \\alpha)^{3}$（ここでは2つの2次式の差の $x^{2}$ の係数が $-2$）を直接使うと，$\\frac{2}{6}(4)^{3} = \\frac{64}{3}$ と一気に求まる。ただし記述では公式の適用条件を一言添えること。", "rubric": [{"item": "交点の $x$ 座標を正しく求めている", "points": 3}, {"item": "区間内で上下関係を判断し，差の積分として立式している", "points": 3}, {"item": "計算が正確で、途中の式変形に誤りがない", "points": 2}, {"item": "最後に答え（結論）を明確に書いている", "points": 2}], "tpl": "rigaku_two_parabolas", "figure": {"type": "parabola2", "a1": 1, "b1": 0, "c1": 0, "a2": -1, "b2": 8, "c2": 0, "lo": 0, "hi": 4}, "date": "2026-12-09", "course": "rigaku"}, "2026-12-10": {"category": "指数・対数", "minutes": 12, "statement": "方程式 $\\log_{2}(x - 0) + \\log_{2}(x - 2) = 3$ を解け。", "hints": ["対数の方程式は，最初に真数条件（定義域）を書くのが鉄則。", "和の形の対数は積にまとめられる。すると真数同士の二次方程式になる。", "出てきた候補のうち，真数条件を満たさないものは解ではない。最後に必ず吟味を。"], "answer": "$x = 4$", "solution": "真数条件は $x - 0 > 0$ かつ $x - 2 > 0$，すなわち $x > 2$。\n左辺をまとめると $\\log_{2}(x - 0)(x - 2) = 3$ より $(x - 0)(x - 2) = 2^{3} = 8$。\n展開して整理すると $x^{2} - 2x + -8 = 0$，因数分解すると $(x - 4)(x - -2) = 0$ となり，候補は $x = 4, -2$。\n真数条件 $x > 2$ を満たすのは $x = 4$ だけである。", "alt": "研究：対数の和を積にまとめる変形は同値ではない（定義域が広がる）ため，余分な根が混ざる。逆に積を和に分けるときは定義域が狭まり，根を失うことがある。同値性の意識が記述の要。", "rubric": [{"item": "真数条件（定義域）を最初に明示している", "points": 3}, {"item": "対数の性質で1つの対数にまとめ，二次方程式に帰着している", "points": 3}, {"item": "計算が正確で、途中の式変形に誤りがない", "points": 2}, {"item": "最後に答え（結論）を明確に書いている", "points": 2}], "tpl": "rigaku_log_eq", "date": "2026-12-10", "course": "rigaku"}, "2026-12-11": {"category": "ベクトル", "minutes": 12, "statement": "$\\vec{a} = (2, -2)$，$\\vec{b} = (-3, 3)$ のとき，$|\\vec{a} + t\\vec{b}|$（$t$ は実数）の最小値と，そのときの $t$ の値を求めよ。", "hints": ["大きさの最小は，2乗してから考える（根号が消えて二次関数になる）。", "$|\\vec{a} + t\\vec{b}|^{2}$ を $t$ の式として展開し，平方完成する。", "最小になる $t$ は，$\\vec{a} + t\\vec{b}$ が $\\vec{b}$ と垂直になる点でもある（内積0で検算できる）。"], "answer": "最小値 $0$（$t = \\frac{2}{3}$ のとき）", "solution": "$|\\vec{a} + t\\vec{b}|^{2} = 18t^{2} + -24t + 8$ と展開できる。\n平方完成すると $18\\left( t - \\frac{2}{3} \\right)^{2} + 0$ となり，$t = \\frac{2}{3}$ のとき最小値 $0$ をとる。\nよって $|\\vec{a} + t\\vec{b}|$ の最小値は $0$。", "alt": "別解：最小のとき $\\vec{a} + t\\vec{b}$ は $\\vec{b}$ と垂直だから，内積 $(\\vec{a} + t\\vec{b}) \\cdot \\vec{b} = 0$ を解いても $t$ が求まる。幾何的には点と直線の距離の問題と同じ。", "rubric": [{"item": "2乗して $t$ の二次関数として処理している", "points": 3}, {"item": "平方完成（または内積＝0）で最小の $t$ を求めている", "points": 3}, {"item": "計算が正確で、途中の式変形に誤りがない", "points": 2}, {"item": "最後に答え（結論）を明確に書いている", "points": 2}], "tpl": "rigaku_vector_min", "date": "2026-12-11", "course": "rigaku"}, "2026-12-12": {"category": "数列", "minutes": 12, "statement": "数列 $\\{a_n\\}$ は $a_1 = 3$，$a_{n+1} = -2a_n + 5$ を満たす。\n(1) 一般項 $a_n$ を求めよ。\n(2) $a_{7}$ の値を求めよ。", "hints": ["$a_{n+1} = pa_n + q$ 型は，両辺から「ある定数」を引くと等比数列になる。その定数は特性方程式で求める。", "引く定数 $\\alpha$ は $\\alpha = -2\\alpha + 5$ の解。", "等比数列の一般項に直したら，$a_1$ で初項を確かめてから $n$ の式にしよう。"], "answer": "(1) $a_n = \\frac{5}{3} + \\frac{4}{3} \\cdot -2^{n-1}$　(2) $a_{7} = 87$", "solution": "特性方程式 $x = -2x + 5$ を解くと $x = \\frac{5}{3}$。\n$a_{n+1} - \\frac{5}{3} = -2(a_n - \\frac{5}{3})$ と変形できるので，数列 $\\{a_n - \\frac{5}{3}\\}$ は初項 $\\frac{4}{3}$，公比 $-2$ の等比数列。\nよって $a_n = \\frac{5}{3} + \\frac{4}{3} \\cdot -2^{n-1}$。\n(2) $n = 7$ を代入して $a_{7} = 87$。", "alt": "研究：$p = 1$ のときは等差数列になり，同じ手法は使えない（特性方程式が解をもたない）。また $a_{n+1} = pa_n + q$ の形は一次の差分方程式で，$n \\to \\infty$ での収束は $|p| < 1$ のときに限る。", "rubric": [{"item": "特性方程式から引く定数を求め，等比数列に帰着している", "points": 3}, {"item": "初項の確認をして一般項を正しく表している", "points": 3}, {"item": "計算が正確で、途中の式変形に誤りがない", "points": 2}, {"item": "最後に答え（結論）を明確に書いている", "points": 2}], "tpl": "rigaku_recurrence", "date": "2026-12-12", "course": "rigaku"}, "2026-12-13": {"category": "整数の性質", "minutes": 12, "statement": "方程式 $3x + 7y = 84$ を満たす正の整数の組 $(x, y)$ をすべて求めよ。また，組の個数も答えよ。", "hints": ["まず解を1つ見つける（係数の倍数を試すと見つかる）。", "一般解は「特殊解＋周期」の形。$a$ と $b$ が互いに素なら，$x$ は $b$ ずつ，$y$ は $a$ ずつ動く。", "正の整数という条件で $k$ の範囲を絞る。端の確かめを忘れずに。"], "answer": "$(7, 9), (14, 6), (21, 3)$ の $3$ 組", "solution": "まず特殊解を1つ見つける。$x = 7, y = 9$ が解になる（$3 \\times 7 + 7 \\times 9 = 84$）。\n$3(x - 7) + 7(y - 9) = 0$ と変形でき，$3$ と $7$ は互いに素だから，$x - 7 = 7k$，$y - 9 = -3k$（$k$ は整数）と表せる。\n$x > 0, y > 0$ の範囲で $k$ を動かすと，組は $(7, 9, 14, 6, 21, 3)$ の $3$ 組。", "alt": "別解：合同式を使う方法もある。$3x \\equiv 84 \\pmod{7}$ を解いて $x$ の候補を絞るやり方で，係数が大きいときに速い。", "rubric": [{"item": "特殊解を1つ見つけ，一般解の形を導いている", "points": 3}, {"item": "正の整数の範囲で $k$ を絞り，組を漏れなく挙げている", "points": 3}, {"item": "計算が正確で、途中の式変形に誤りがない", "points": 2}, {"item": "最後に答え（結論）を明確に書いている", "points": 2}], "tpl": "rigaku_diophantine", "date": "2026-12-13", "course": "rigaku"}, "2026-12-14": {"category": "数列", "minutes": 12, "statement": "数列 $a_n = (4 + 2(n-1)) \\cdot -2^{n-1}$ の初項から第 $6$ 項までの和 $S_{6}$ を求めよ。", "hints": ["等差数列×等比数列の和は，$S$ と $rS$ の差をとるのが定石。", "差をとると真ん中の項が等比数列の和になり，両端に2項だけ残る。", "最後は $(1-r)$ で割る。$r$ が分数のときは計算ミスに注意。"], "answer": "$S_{6} = -312$", "solution": "$S = S_{6}$ と $rS$（$r = -2$）の差をとると，等比数列の和に帰着する「等差×等比」の常套手段が使える。\n項を書き出すと $S_{6} = 4 + -12 + 32 + -80 + 192 + -448$。\n差をとって整理すると $S_{6} = -312$ となる。", "alt": "研究：この手法は $\\sum n r^{n}$ 型の無限級数（$|r|<1$ で収束）の計算にもそのまま使える。確率の期待値の計算（幾何分布）にも現れる考え方。", "rubric": [{"item": "$S$ と $rS$ の差をとる方法で等比数列の和に帰着している", "points": 3}, {"item": "両端に残る項の処理が正しい", "points": 3}, {"item": "計算が正確で、途中の式変形に誤りがない", "points": 2}, {"item": "最後に答え（結論）を明確に書いている", "points": 2}], "tpl": "rigaku_mixed_series", "date": "2026-12-14", "course": "rigaku"}, "2026-12-15": {"category": "二次関数", "minutes": 12, "statement": "$f(x) = x^{2} - 6x - 1$（$0 \\le x \\le 4$）の最大値と最小値，およびそのときの $x$ の値を求めよ。", "hints": ["まず平方完成して軸の位置を求めよう。軸が区間の中にあるかどうかが分かれ目だ。", "最大・最小の候補は「頂点」と「区間の両端」の3点だけ。この3点を比べればよい。", "頂点の値 $f(3)$ と両端の値を計算して，大きい順に並べてみよう。"], "answer": "最大値 $-1$（$x=0$ のとき），最小値 $-10$（$x=3$ のとき）", "solution": "$f(x)$ を平方完成すると $f(x) = (x - 3)^{2} - 10$ となり，軸は $x = 3$ で区間内にある。\n端点の値は $f(0) = -1$，$f(4) = -9$，頂点の値は $f(3) = -10$。\nこれらを比べて，最大値 $-1$（$x=0$），最小値 $-10$（$x=3$）。", "alt": "研究：軸が区間の外にあると，最大・最小はどちらも端点でとる。軸と区間の位置関係で場合分けするのが，文字係数の問題（例：$f(x)=x^{2}-2ax+3$）でも同じ考え方になる。", "rubric": [{"item": "平方完成をして軸の位置を正しく求めている", "points": 3}, {"item": "頂点と両端の3点をすべて比較している", "points": 3}, {"item": "計算が正確で、途中の式変形に誤りがない", "points": 2}, {"item": "最後に答え（結論）を明確に書いている", "points": 2}], "tpl": "rigaku_quad_interval", "figure": {"type": "parabola", "a": 1.0, "b": -6.0, "c": -1.0, "lo": 0, "hi": 4}, "date": "2026-12-15", "course": "rigaku"}, "2026-12-16": {"category": "場合の数", "minutes": 10, "statement": "男子 $6$ 人と女子 $6$ 人の中から $3$ 人の委員を選ぶ。女子が $2$ 人以上入る選び方は何通りあるか。", "hints": ["「〜人以上」は，人数ごとに場合分けして足すのが基本。", "女子の人数を決めれば，男子の人数も自動的に決まる。", "余事象（女子が少ない場合を全体から引く）でも計算できる。人数が少ないほうを選ぶと速い。"], "answer": "$110$ 通り", "solution": "場合分けして数える。\n女子 $2$ 人・男子 $1$ 人の場合が ${}_{6}C_{2} \\times {}_{6}C_{1} = 90$ 通り，女子 $3$ 人・男子 $0$ 人の場合が ${}_{6}C_{3} \\times {}_{6}C_{0} = 20$ 通り。\n合計して $110$ 通り。", "alt": "別解：全体 ${}_{12}C_{3} = 220$ 通りから，女子が 1 人以下の場合を引く余事象の計算でも同じ答えになる。どちらの場合分けが少ないかを見てから解き始めるのが実戦的。", "rubric": [{"item": "女子の人数で場合分けし，各場合を積の法則で数えている", "points": 3}, {"item": "場合の漏れ・重なりがないことを確認している", "points": 3}, {"item": "計算が正確で、途中の式変形に誤りがない", "points": 2}, {"item": "最後に答え（結論）を明確に書いている", "points": 2}], "tpl": "rigaku_committee", "date": "2026-12-16", "course": "rigaku"}, "2026-12-17": {"category": "確率", "minutes": 12, "statement": "赤玉 $5$ 個と白玉 $6$ 個が入った袋から，玉を1個ずつ2回，元に戻さずに取り出す。\n(1) 1回目が白，2回目が赤である確率を求めよ。\n(2) 1回目が白であったとき，2回目が赤である条件付き確率を求めよ。", "hints": ["元に戻さない取り出しでは，2回目は全体の個数が1つ減ることに注意。", "(1)は積の法則。(2)は「条件のもとでの世界」に移って考える。", "(2)は定義どおり $\\frac{P(白→赤)}{P(白)}$ で計算しても同じになる。"], "answer": "(1) $\\frac{3}{11}$　(2) $\\frac{1}{2}$", "solution": "(1) 1回目が白の確率は $\\frac{6}{11}$，そのあと2回目が赤の確率は $\\frac{5}{10}$。積の法則より $\\frac{6}{11} \\times \\frac{5}{10} = \\frac{3}{11}$。\n(2) 条件付き確率は「1回目が白」という条件のもとでの確率。白を1個取り除いた残り $10$ 個から赤を引く確率で，$\\frac{5}{10} = \\frac{1}{2}$。", "alt": "研究：条件付き確率はベイズの定理の土台。(2)のように「条件が付くと分母の世界が変わる」という見方が，検査の陽性的中率などの応用で効いてくる。", "rubric": [{"item": "元に戻さない場合の個数の変化を正しく扱っている", "points": 3}, {"item": "条件付き確率を，条件のもとでの確率として計算している", "points": 3}, {"item": "計算が正確で、途中の式変形に誤りがない", "points": 2}, {"item": "最後に答え（結論）を明確に書いている", "points": 2}], "tpl": "rigaku_conditional_prob", "date": "2026-12-17", "course": "rigaku"}, "2026-12-18": {"category": "微分・積分", "minutes": 15, "statement": "放物線 $y = x^{2}$ 上の点 $(1, 1)$ における接線を $l$ とする。\n(1) 接線 $l$ の方程式を求めよ。\n(2) 接線 $l$ と放物線，および直線 $x = 3$ で囲まれた部分の面積を求めよ。", "hints": ["接線は「微分係数＝傾き」から作る。接点の座標も忘れずに。", "(2)では曲線と接線の差をとると $(x-t)^{2}$ の形に因数分解できるはず。接する＝差が重解をもつ，という関係を使う。", "面積は「上の式 − 下の式」の積分。区間内で差の符号が変わらないことを確認してから積分しよう。"], "answer": "(1) $y = 2x - 1$　(2) $\\frac{8}{3}$", "solution": "(1) $y' = 2x$ より，接線の傾きは $2 \\cdot 1 = 2$。よって $l: y = 2(x - 1) + 1$，整理して $y = 2x - 1$。\n(2) 放物線と接線の差は $x^{2} - (2x - 1) = (x - 1)^{2}$ と因数分解できる（接するので重解をもつ）。\n面積は $\\int_{1}^{3} (x - 1)^{2} dx = \\left[ \\frac{1}{3}(x - 1)^{3} \\right]_{1}^{3} = \\frac{(2)^{3}}{3} = \\frac{8}{3}$。", "alt": "研究：放物線とその接線の間の面積には $\\frac{(\\beta - \\alpha)^{3}}{3}$ 型の公式がある。一般に2次関数と直線で囲まれた面積は $\\frac{|a|}{6}(\\beta-\\alpha)^{3}$（いわゆる1/6公式）で計算でき，検算に使える。", "rubric": [{"item": "接線の方程式を微分係数から正しく求めている", "points": 3}, {"item": "差が $(x-t)^{2}$ と因数分解できることを使って積分している", "points": 3}, {"item": "計算が正確で、途中の式変形に誤りがない", "points": 2}, {"item": "最後に答え（結論）を明確に書いている", "points": 2}], "tpl": "rigaku_tangent_area", "figure": {"type": "parabola", "a": 1, "b": 0, "c": 0, "lo": 0, "hi": 4}, "date": "2026-12-18", "course": "rigaku"}, "2026-12-19": {"category": "三角関数", "minutes": 12, "statement": "$0 \\le x \\le \\pi$ のとき，$y = 3\\sin x + 4\\cos x$ の最大値と，そのときの $\\sin x, \\cos x$ の値を求めよ。", "hints": ["$a\\sin x + b\\cos x$ は1つの $\\sin$ に合成できる。合成後の係数が最大値になる。", "$\\sqrt{3^{2} + 4^{2}} = 5$ をくくり出す形で合成してみよう。", "最大になるのは合成した角が $\\frac{\\pi}{2}$ のとき。その $x$ に対する $\\sin x, \\cos x$ は $\\alpha$ で表せる。"], "answer": "最大値 $5$，そのとき $\\sin x = \\frac{3}{5}$，$\\cos x = \\frac{4}{5}$", "solution": "合成すると $y = 5\\sin(x + \\alpha)$（ただし $\\cos\\alpha = \\frac{3}{5}$，$\\sin\\alpha = \\frac{4}{5}$）。\n$0 \\le x \\le \\pi$ では $x + \\alpha$ が $\\frac{\\pi}{2}$ をとれるので，最大値は $5$。\nこのとき $\\sin x = \\cos\\alpha = \\frac{3}{5}$，$\\cos x = \\sin\\alpha = \\frac{4}{5}$。", "alt": "別解：コーシー・シュワルツの不等式 $(p\\sin x + q\\cos x)^{2} \\le (p^{2}+q^{2})(\\sin^{2}x+\\cos^{2}x)$ からも最大値が得られる。等号成立条件が $\\sin x : \\cos x = p : q$ であることも確認しよう。", "rubric": [{"item": "三角関数の合成を正しく行っている", "points": 3}, {"item": "最大値をとる $x$ の存在を区間内で確認している", "points": 3}, {"item": "計算が正確で、途中の式変形に誤りがない", "points": 2}, {"item": "最後に答え（結論）を明確に書いている", "points": 2}], "tpl": "rigaku_trig_synth", "date": "2026-12-19", "course": "rigaku"}, "2026-12-20": {"category": "極限", "minutes": 10, "statement": "極限 $\\lim_{x \\to 9} \\frac{\\sqrt{x - 5} - 2}{x - 9}$ を求めよ。", "hints": ["$\\frac{0}{0}$ の形はそのままでは決まらない。因数分解か有理化で「消える因子」を作る。", "根号は共役な式を掛けるのが定石。分子が $x - r$ の形になるはず。", "約分したあとに代入する。約分前の式に代入してはいけない。"], "answer": "$\\frac{1}{4}$", "solution": "分母が $0$ になるので，分子の根号を有理化する。\n$\\frac{(\\sqrt{x - 5} - 2)(\\sqrt{x - 5} + 2)}{(x - 9)(\\sqrt{x - 5} + 2)} = \\frac{x - 9}{(x - 9)(\\sqrt{x - 5} + 2)}$。\n$x \\ne 9$ では約分できて $\\frac{1}{\\sqrt{x - 5} + 2}$ となり，$x \\to 9$ で $\\frac{1}{4}$。", "alt": "研究：この極限は関数 $\\sqrt{x + -5}$ の $x = 9$ における微分係数そのもの。定義に戻る計算と，微分公式の結果が一致することを確かめよう。", "rubric": [{"item": "有理化（共役な式を掛ける）で不定形を解消している", "points": 3}, {"item": "約分してから極限をとっている", "points": 3}, {"item": "計算が正確で、途中の式変形に誤りがない", "points": 2}, {"item": "最後に答え（結論）を明確に書いている", "points": 2}], "tpl": "rigaku_limit_sqrt", "date": "2026-12-20", "course": "rigaku"}, "2026-12-21": {"category": "積分", "minutes": 12, "statement": "放物線 $y = x^{2}$ と $y = -x^{2} + 8$ で囲まれた部分の面積を求めよ。", "hints": ["まず交点の $x$ 座標を求める。囲まれた部分は交点の間だけにできる。", "「上の式 − 下の式」を積分する。どっちが上かは区間内の1点で試すと分かる。", "差を因数分解すると $-2(x-r_1)(x-r_2)$ の形になる。1/6公式が使える形だ。"], "answer": "$\\frac{64}{3}$", "solution": "2つの放物線の交点は $x^{2} = -x^{2} + 8$，すなわち $2x^{2} - 0x + -8 = 0$ を解いて $x = -2, 2$。\n区間 $-2 \\le x \\le 2$ では $y = -x^{2} + 8$ が上にある。差は $-2(x - -2)(x - 2)$ と因数分解できる。\n面積は $\\int_{-2}^{2} \\{ -2(x - -2)(x - 2) \\} dx = \\frac{64}{3}$（1/6公式でも同じ値になる）。", "alt": "別解：1/6公式 $\\frac{|a|}{6}(\\beta - \\alpha)^{3}$（ここでは2つの2次式の差の $x^{2}$ の係数が $-2$）を直接使うと，$\\frac{2}{6}(4)^{3} = \\frac{64}{3}$ と一気に求まる。ただし記述では公式の適用条件を一言添えること。", "rubric": [{"item": "交点の $x$ 座標を正しく求めている", "points": 3}, {"item": "区間内で上下関係を判断し，差の積分として立式している", "points": 3}, {"item": "計算が正確で、途中の式変形に誤りがない", "points": 2}, {"item": "最後に答え（結論）を明確に書いている", "points": 2}], "tpl": "rigaku_two_parabolas", "figure": {"type": "parabola2", "a1": 1, "b1": 0, "c1": 0, "a2": -1, "b2": 0, "c2": 8, "lo": -2, "hi": 2}, "date": "2026-12-21", "course": "rigaku"}, "2026-12-22": {"category": "指数・対数", "minutes": 12, "statement": "方程式 $\\log_{2}(x - 1) + \\log_{2}(x - 4) = 2$ を解け。", "hints": ["対数の方程式は，最初に真数条件（定義域）を書くのが鉄則。", "和の形の対数は積にまとめられる。すると真数同士の二次方程式になる。", "出てきた候補のうち，真数条件を満たさないものは解ではない。最後に必ず吟味を。"], "answer": "$x = 5$", "solution": "真数条件は $x - 1 > 0$ かつ $x - 4 > 0$，すなわち $x > 4$。\n左辺をまとめると $\\log_{2}(x - 1)(x - 4) = 2$ より $(x - 1)(x - 4) = 2^{2} = 4$。\n展開して整理すると $x^{2} - 5x + function reviewDue(course, date){

function isDueToday(course, date){ const r=reviewDue(course, date); return r && diffDays(todayStr(), r.due)>=0; }

        if(cmd==="sqrt"){
          let root="";
          if(src[i]==="["){ i++; let r=""; while(i<n && src[i]!=="]"){ r+=src[i]; i++; } i++; root=`<span class="sroot">${esc(r)}</span>`; }
          const a=parseAtom(); out+=`<span class="sqrt">${root}<span class="rad">√</span><span class="sbody">${a}</span></span>`; continue; }
        if(cmd==="vec"){ const a=parseAtom(); out+=`<span class="vec">${a}</span>`; continue; }
        if(cmd==="overline"){ const a=parseAtom(); out+=`<span class="oline">${a}</span>`; continue; }
        if(cmd==="pmod"){ const a=parseAtom(); out+=`(mod ${a})`; continue; }
        if(cmd==="mathrm"){ const a=parseRawGroup(); out+=esc(a); continue; }
        if(SYMBOLS[cmd]!==undefined){ out+= (/^(sin|cos|tan|log|ln|lim|gcd)$/.test(cmd)) ? `<span style="font-style:normal">${SYMBOLS[cmd]}</span>` : SYMBOLS[cmd]; continue; }
        out+=esc(cmd); continue;
      }
      if(ch==="^"){ i++; const a=parseAtom(); out+=`<sup>${a}</sup>`; continue; }
      if(ch==="_"){ i++; const a=parseAtom(); out+=`<sub>${a}</sub>`; continue; }
      if(/[a-zA-Z]/.test(ch)){ out+=`<i>${ch}</i>`; i++; continue; }
      out+=esc(ch); i++;
    }
    return out;
  }
  function parseAtom(){
    if(i>=n) return "";
    if(src[i]==="{"){ i++; return parseSeq("}"); }
    if(src[i]==="\\"){ return parseSeq2(); }
    const ch=src[i]; i++;
    return /[a-zA-Z]/.test(ch) ? `<i>${ch}</i>` : esc(ch);
  }
  function parseSeq2(){ // 単一コマンドを atom として処理するため、位置を戻して parseSeq 的に1要素だけ読む
    const save=i; i++; // backslash を消費した状態にする
    // ここでは簡易に: コマンド名を読み、sup/sub の中身として表示
    let cmd=""; while(i<n && /[a-zA-Z]/.test(src[i])){ cmd+=src[i]; i++; }
    if(SYMBOLS[cmd]!==undefined) return SYMBOLS[cmd];
    i=save; return parseSeqAtomFallback();
  }
  function parseSeqAtomFallback(){ const ch=src[i]||""; i++; return esc(ch); }
  function parseRawGroup(){ if(src[i]==="{"){ i++; let t=""; while(i<n && src[i]!=="}"){ t+=src[i]; i++; } i++; return t; } return ""; }
  return `<span class="math">${parseSeq(null)}</span>`;
}
function renderText(src){
  const parts=String(src??"").split(/\$([^$]*)\$/g);
  return parts.map((p,idx)=> idx%2===1 ? mathHTML(p) : esc(p)).join("");
}
/* ---------- figure (SVG from problem parameters) ---------- */
function plotSVG(funcs, lo, hi, opts){
  opts=opts||{};
  const W=340, H=250, pad=26;
  let ymin=Infinity, ymax=-Infinity;
  const N=120;
  const series=funcs.map(f=>{
    const pts=[];
    for(let k=0;k<=N;k++){ const x=lo+(hi-lo)*k/N; const y=f(x); if(isFinite(y)){ pts.push([x,y]); if(y<ymin)ymin=y; if(y>ymax)ymax=y; } }
    return pts;
  });
  if(!isFinite(ymin)){ ymin=-5; ymax=5; }
  if(ymax-ymin<4){ const m=(ymax+ymin)/2; ymin=m-2; ymax=m+2; }
  const yr=(ymax-ymin)*0.12; ymin-=yr; ymax+=yr;
  const X=x=> pad+(x-lo)/(hi-lo)*(W-2*pad);
  const Y=y=> H-pad-(y-ymin)/(ymax-ymin)*(H-2*pad);
  let g="";
  const y0=(ymin<0&&ymax>0)? Y(0): null, x0=(lo<0&&hi>0)? X(0): null;
  if(y0!==null) g+=`<line x1="${pad}" y1="${y0}" x2="${W-pad}" y2="${y0}" stroke="#888" stroke-width="1.2"/>`;
  if(x0!==null) g+=`<line x1="${x0}" y1="${pad}" x2="${x0}" y2="${H-pad}" stroke="#888" stroke-width="1.2"/>`;
  g+=`<text x="${W-pad-4}" y="${(y0??pad)-5}" font-size="11" fill="#555">x</text><text x="${(x0??W-pad)+5}" y="${pad+4}" font-size="11" fill="#555">y</text>`;
  const cols=["#b0483e","#274156","#2e7d4f"];
  series.forEach((pts,si)=>{
    const d=pts.map((p,k)=> (k? "L":"M")+X(p[0]).toFixed(1)+","+Y(p[1]).toFixed(1)).join(" ");
    g+=`<path d="${d}" fill="none" stroke="${cols[si%3]}" stroke-width="2.2"/>`;
  });
  (opts.points||[]).forEach(p=>{
    g+=`<circle cx="${X(p[0])}" cy="${Y(p[1])}" r="3.4" fill="#b57e2e"/><text x="${X(p[0])+6}" y="${Y(p[1])-6}" font-size="11.5" fill="#333">${esc(p[2]||"")}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="図">${g}</svg>`;
}
function figureHTML(fig){
  if(!fig) return "";
  try{
    if(fig.type==="parabola"){ return `<div class="figwrap">${plotSVG([x=>fig.a*x*x+fig.b*x+fig.c], fig.lo, fig.hi)}</div>`; }
    if(fig.type==="parabola2"){ return `<div class="figwrap">${plotSVG([x=>fig.a1*x*x+fig.b1*x+fig.c1, x=>fig.a2*x*x+fig.b2*x+fig.c2], fig.lo-0.6, fig.hi+0.6)}</div>`; }
    if(fig.type==="parabola_line"){ return `<div class="figwrap">${plotSVG([x=>fig.a*x*x+fig.b*x+fig.c, x=>fig.m*x+fig.n], fig.lo-0.6, fig.hi+0.6)}</div>`; }
    if(fig.type==="two_lines"){ return `<div class="figwrap">${plotSVG([x=>fig.m1*x+fig.b1, x=>fig.m2*x+fig.b2], -6, 6)}</div>`; }
  }catch(e){}
  return "";
}

<script>

function validProblem(p){
  return p && typeof p.date==="string" && /^\d{4}-\d{2}-\d{2}$/.test(p.date)
    && ["rigaku","bunkei","koko"].includes(p.course)
    && typeof p.category==="string" && typeof p.minutes==="number"
    && typeof p.statement==="string" && Array.isArray(p.hints) && p.hints.length===3
    && typeof p.answer==="string" && typeof p.solution==="string" && typeof p.alt==="string"

function importPack(input){
  const file=input.files && input.files[0]; if(!file) return;
  const rd=new FileReader();
  rd.onload=()=>{
    const msg=$("#packMsg");

      const j=JSON.parse(rd.result);
      const list=Array.isArray(j)? j : j.problems;
      if(!Array.isArray(list) || !list.length) throw new Error("問題が入っていません");
      let ok=0, ng=0;
      list.forEach(p=>{ if(validProblem(p)){ S.imported[p.course][p.date]=p; ok++; } else ng++; });
      if(!ok) throw new Error("取り込める問題がありませんでした（形式が合いません）");
      const name=(j && j.pack)? String(j.pack) : file.name;
      S.packs[name]={ name, at: todayStr(), count: ok };
      save();
      if(msg) msg.textContent=`${name} を取り込みました（${ok} 問${ng? `／形式が合わず除外 ${ng} 問`:""}）。カレンダーから開けます。`;
      syncChrome(); renderMain();
    }catch(e){ if(msg) msg.textContent="取り込めませんでした："+e.message; }
    input.value="";
  };
  rd.readAsText(file);
}
/* ---------- update ---------- */
async function updateApp(){
  if(!confirm("最新の版に更新しますか？（記録データは消えません）")) return;
  try{
    if(window.caches){ const keys=await caches.keys(); await Promise.all(keys.map(k=>caches.delete(k))); }
    if(navigator.serviceWorker){ const reg=await navigator.serviceWorker.getRegistration(); if(reg) await reg.update(); }
  }catch(e){}
  location.reload();
}
/* ---------- boot ---------- */
try{
  load(); syncChrome(); renderMain();
  if("serviceWorker" in navigator){ navigator.serviceWorker.register("sw.js").catch(()=>{}); }
}catch(e){
  $("#app").innerHTML=`<div class="card"><h2>アプリを起動できませんでした</h2><p class="small">${esc(e.message||e)}</p></div>`;
}
</script>
